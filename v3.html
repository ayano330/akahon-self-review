<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f6b4a">

<title>赤本セルフチェック(生物)試作版 v3</title>
<link rel="icon" type="image/png" sizes="32x32" href="akahon-icon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="akahon-icon-180.png">
<link rel="apple-touch-icon" href="akahon-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f6f8f7;
  --card: #ffffff;
  --fg: #1c2a24;
  --muted: #55645c;
  --border: #d5ddd8;
  --primary: #1f6b4a;
  --primary-fg: #ffffff;
  --primary-soft: #e6f3ec;
  --warn-bg: #fff4dc;
  --warn-fg: #7a4b00;
  --danger: #b3261e;
  --radius: 12px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  line-height: 1.7;
  font-size: 16px;
}
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 64px; }
h1 { font-size: 1.35rem; line-height: 1.4; margin: 0 0 8px; }
h2 { font-size: 1.1rem; margin: 0 0 8px; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
h1:focus { outline: none; }

.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row-end { justify-content: flex-end; }
.nowrap-row { flex-wrap: nowrap; }
.row-between { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.card-accent { border-color: var(--primary); border-width: 2px; }
.muted { color: var(--muted); font-size: 0.9rem; }
.badge { display: inline-block; background: var(--warn-bg); color: var(--warn-fg); border-radius: 999px; padding: 2px 12px; font-size: 0.8rem; font-weight: 700; }
.notice { background: var(--primary-soft); border-radius: var(--radius); padding: 12px 16px; }
.notice-warn { background: var(--warn-bg); color: var(--warn-fg); }
.error { color: var(--danger); font-weight: 700; }
ul.plain { margin: 0; padding-left: 1.2em; }
ul.plain li { margin: 2px 0; }
ol.steps { margin: 0; padding-left: 1.4em; }
ol.steps li { margin: 4px 0; }

.progress { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--primary); }

fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 700; padding: 0; margin-bottom: 8px; }
.options { display: flex; flex-wrap: wrap; gap: 8px; }
.option { position: relative; }
.option input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.option span { display: block; padding: 10px 14px; min-height: 44px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--card); }
.option:has(input:checked) span { border-color: var(--primary); background: var(--primary-soft); font-weight: 700; }
.option:has(input:focus-visible) span { outline: 3px solid var(--primary); outline-offset: 2px; }
.options.col { flex-direction: column; }
.options.col .option span { width: 100%; }
.options.fit { flex-wrap: nowrap; gap: 6px; }
.options.fit .option { flex: 1; min-width: 0; }
.options.fit .option span { padding: 10px 4px; font-size: 0.8rem; text-align: center; display: flex; align-items: center; justify-content: center; }
.follow-btns { display: flex; flex-wrap: nowrap; gap: 6px; }
.follow-btns .btn { flex: 1; min-width: 0; padding: 8px 4px; font-size: 0.8rem; }
.prom-pick { cursor: pointer; }
.prom-pick.dim { opacity: 0.4; }

input[type="number"], input[type="text"], input[type="date"], input[type="time"], textarea {
  width: 100%;
  font: inherit;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--fg);
}
textarea { min-height: 120px; resize: vertical; }
textarea.short { min-height: 88px; }
label.field { display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
.inline-num { display: flex; align-items: center; gap: 8px; }
.inline-num input { max-width: 140px; }

.btn { font: inherit; font-weight: 700; min-height: 44px; padding: 8px 20px; border-radius: var(--radius); border: 2px solid var(--primary); background: var(--card); color: var(--primary); cursor: pointer; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-quiet { border-color: var(--border); color: var(--muted); font-weight: 400; }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-sm { min-height: 40px; padding: 4px 14px; font-size: 0.95rem; }

.bar-row { display: grid; grid-template-columns: 8.5em 1fr 2.5em; gap: 8px; align-items: center; font-size: 0.9rem; }
.bar { height: 12px; background: var(--border); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: #8fb7a2; }
.bar-row.top .bar > span { background: var(--primary); }
.score-big { font-size: 2rem; font-weight: 700; line-height: 1.2; }
.score-wrap { position: relative; display: inline-flex; align-items: center; gap: 8px; }
.cele { font-size: 1.9rem; line-height: 1; display: inline-block; transform-origin: 20% 80%; }
.cele.pop { animation: cele-pop 0.7s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
@keyframes cele-pop { 0% { transform: scale(0.2) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
.confetti { position: absolute; left: 100%; top: 50%; width: 0; height: 0; pointer-events: none; z-index: 2; }
.confetti i { position: absolute; left: 0; top: 0; width: 8px; height: 12px; border-radius: 2px; opacity: 0; animation: confetti-burst 1.9s ease-out both; }
@keyframes confetti-burst {
  0% { transform: translate(0, 0) rotate(0) scale(0.4); opacity: 1; }
  35% { transform: translate(calc(var(--dx) * 0.8), calc(var(--up) * -1)) rotate(calc(var(--rot) * 0.4)) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--fall)) rotate(var(--rot)) scale(1); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } .cele.pop { animation: none; } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.95rem; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.goal { background: var(--primary-soft); border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; }
.chip { display: inline-block; background: var(--primary-soft); border-radius: 999px; padding: 2px 12px; font-size: 0.9rem; }
.chart svg { width: 100%; height: auto; display: block; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.data { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
table.data th, table.data td { border-bottom: 1px solid var(--border); padding: 8px 8px; text-align: left; white-space: nowrap; }
table.data tr.rec-row { cursor: pointer; }
table.data tr.rec-row:hover, table.data tr.rec-row.open { background: var(--primary-soft); }
table.data tr.rec-actions td { white-space: normal; padding: 10px 8px 12px; }
.qa { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.qa-q { font-size: 1.15rem; font-weight: 700; }
.dots { letter-spacing: 2px; color: var(--primary); }

.univ-list { display: flex; flex-direction: column; gap: 8px; }
.univ-btn { font: inherit; text-align: left; width: 100%; min-height: 56px; padding: 12px 16px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--fg); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.univ-btn:hover { border-color: var(--primary); }
.univ-btn strong { font-size: 1.05rem; }
.univ-btn .sub { color: var(--muted); font-size: 0.9rem; text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.9rem; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.status { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: 0.85rem; font-weight: 700; background: var(--primary-soft); color: var(--primary); }
.status.warn { background: var(--warn-bg); color: var(--warn-fg); }
.status.gray { background: #e9ecea; color: var(--muted); }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
.stat b { font-size: 1.4rem; display: block; line-height: 1.3; }
.rec-item { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }

[hidden] { display: none !important; }
input.invalid { border-color: var(--danger); background: #fdecea; }
.icon-btn { font: inherit; width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--muted); cursor: pointer; padding: 0; }
.icon-btn:hover { border-color: var(--primary); color: var(--primary); }
.icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.icon-btn.small { width: 36px; height: 36px; border-width: 1px; border-radius: 8px; }
.icon-btn svg, .btn svg { width: 20px; height: 20px; flex: none; }
.icon-btn.small svg { width: 18px; height: 18px; }
.btn .ic { display: inline-flex; align-items: center; gap: 6px; }
.univ-card { display: flex; align-items: stretch; gap: 4px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 4px; }
.univ-card .univ-btn { flex: 1; min-width: 0; border: 0; background: transparent; }
.univ-card .univ-btn:hover { border-color: transparent; }
.univ-card .univ-btn strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.univ-actions { display: flex; align-items: center; gap: 2px; padding-right: 2px; }
.univ-card.editing { display: block; padding: 12px; }
.fields-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.score-phrase { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 8px; }
.score-phrase .score-n-field { gap: 4px; }
.score-n-wrap { display: flex; align-items: center; gap: 2px; font-weight: 700; }
.score-n-wrap input { width: 4.5em; max-width: none; text-align: center; padding-left: 6px; padding-right: 6px; }
.score-phrase-word { padding-bottom: 12px; font-weight: 700; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.suggest .chip-btn { font: inherit; min-height: 40px; padding: 4px 14px; border: 2px solid var(--primary); border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 700; cursor: pointer; }
table.data td.num, table.data th.num { text-align: right; white-space: nowrap; }
table.data td.act { width: 44px; text-align: right; padding: 2px 4px; }
.sr-only { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* 約束カード: 罫線ノートの切れ端。ほかの画面と違う、手書きの雰囲気で目を引く */
.scrap-wrap {
  --hand: "Klee", "Klee One", "UD Digi Kyokasho N-R", "UD デジタル 教科書体 N-R", "HG教科書体", "Hiragino Maru Gothic ProN", "Yu Gothic UI", sans-serif;
  position: relative; margin: 14px 6px 10px; transform: rotate(-1.2deg);
  filter: drop-shadow(2px 4px 4px rgba(0, 0, 0, 0.22));
}
.scrap-wrap::before {
  content: ""; position: absolute; top: -11px; left: 50%; width: 88px; height: 22px; margin-left: -44px; z-index: 1;
  background: rgba(255, 213, 79, 0.7); transform: rotate(3deg);
}
.scrap {
  position: relative; padding: 0 16px 2rem 3.4rem; color: #232a4d;
  font-family: var(--hand); font-weight: 600; font-size: 1.05rem; line-height: 2rem;
  background-color: #fffbe8;
  background-image:
    linear-gradient(90deg, transparent 2.7rem, #e57373 2.7rem, #e57373 calc(2.7rem + 2px), transparent calc(2.7rem + 2px)),
    repeating-linear-gradient(180deg, transparent 0, transparent calc(2rem - 1px), #b3d1ea calc(2rem - 1px), #b3d1ea 2rem);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), 96% calc(100% - 1px), 92% calc(100% - 7px), 88% 100%, 84% calc(100% - 5px), 80% calc(100% - 1px), 76% calc(100% - 6px), 72% 100%, 68% calc(100% - 4px), 64% calc(100% - 7px), 60% calc(100% - 1px), 56% calc(100% - 5px), 52% 100%, 48% calc(100% - 6px), 44% calc(100% - 2px), 40% calc(100% - 7px), 36% 100%, 32% calc(100% - 4px), 28% calc(100% - 7px), 24% calc(100% - 1px), 20% calc(100% - 5px), 16% 100%, 12% calc(100% - 6px), 8% calc(100% - 2px), 4% calc(100% - 6px), 0 100%);
}
.scrap p { margin: 0; line-height: 2rem; overflow-wrap: anywhere; }
.scrap-head { display: flex; align-items: center; }
.scrap-head span { display: inline-block; line-height: 1.5rem; padding: 0 14px; font-size: 1.05rem; color: #c62828; border: 2px solid #c62828; border-radius: 52% 48% 55% 45% / 55% 45% 55% 45%; transform: rotate(-3deg); }
.scrap-when { font-size: 1.4rem; color: #c62828; text-decoration: underline wavy #c62828; text-underline-offset: 5px; text-decoration-thickness: 1.5px; transform: rotate(-0.6deg); }
.scrap-body { transform: rotate(0.3deg); }
.scrap-goal { font-size: 0.95rem; }
.scrap-goal mark { background: linear-gradient(transparent 55%, #fff176 55%); color: inherit; }
.stamp { position: absolute; right: 4px; bottom: -14px; width: 112px; height: 112px; transform: rotate(-14deg); mix-blend-mode: multiply; opacity: 0.9; pointer-events: none; }
.stamp svg, .fight svg { width: 100%; height: 100%; display: block; }
.stamp.pop { animation: stamp-in 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
@keyframes stamp-in {
  0% { transform: rotate(-32deg) scale(2.6); opacity: 0; }
  55% { opacity: 0.95; }
  100% { transform: rotate(-14deg) scale(1); opacity: 0.9; }
}
.fight { position: absolute; right: -4px; bottom: -6px; width: 168px; height: 92px; transform: rotate(-12deg); pointer-events: none; }
.fight text { font-family: var(--hand); }
.fight.pop { animation: fight-in 0.5s ease-out both; }
@keyframes fight-in {
  0% { transform: rotate(-12deg) scale(0.4); opacity: 0; }
  100% { transform: rotate(-12deg) scale(1); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) { .stamp.pop, .fight.pop { animation: none; } }

/* 下のタブバー(戻る / ホーム / 約束)。親指で押せる位置 */
.has-tabbar main { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.tabbar-in { max-width: 640px; margin: 0 auto; display: flex; }
.tab { font: inherit; position: relative; flex: 1; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: none; color: var(--muted); font-size: 0.72rem; font-weight: 700; cursor: pointer; padding: 6px 4px; }
.tab span { text-align: center; line-height: 1.15; max-width: 8.5em; }
.tab span.nowrap { white-space: nowrap; max-width: none; font-size: 0.68rem; letter-spacing: -0.01em; }
.tab svg { width: 24px; height: 24px; }
.tab img.ic-img { width: 40px; height: 24px; display: block; }
.tab.on { color: var(--primary); background: var(--primary-soft); }
.tab:disabled { opacity: 0.35; cursor: not-allowed; }
.tab-badges { position: absolute; top: 2px; left: 50%; display: flex; gap: 3px; transform: translateX(8px); pointer-events: none; }
.tab-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--danger); color: #fff; font-size: 0.7rem; line-height: 18px; text-align: center; }
.tab-badge.blue { background: #1565c0; }

/* 約束ページの絞り込み */
.seg { display: flex; gap: 6px; }
.seg-btn { font: inherit; flex: 1; min-height: 44px; padding: 6px 4px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--fg); font-weight: 700; cursor: pointer; }
.seg-btn .seg-n { font-weight: 400; margin-left: 4px; }
.seg-btn.seg-todo, .seg-btn.seg-nexts { border-color: #e0b4b1; color: #b3261e; }
.seg-btn.seg-todo[aria-pressed="true"], .seg-btn.seg-nexts[aria-pressed="true"] { background: #fdecea; border-color: #b3261e; color: #b3261e; }
.seg-btn.seg-partial, .seg-btn.seg-goods { border-color: #90caf9; color: #1565c0; }
.seg-btn.seg-partial[aria-pressed="true"], .seg-btn.seg-goods[aria-pressed="true"] { background: #e3f2fd; border-color: #1565c0; color: #1565c0; }
.seg-btn.seg-done { border-color: #f6d365; color: #8a6d00; }
.seg-btn.seg-done[aria-pressed="true"] { background: #fff8e1; border-color: #f9a825; color: #8a6d00; }

/* 上のヘッダー(タイトル画像 + ハンバーガー) */
#app-header { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--border); }
.app-header-in { position: relative; max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding: 8px 12px; min-height: 56px; }
.app-title-btn { display: flex; align-items: center; justify-content: center; justify-self: center; min-height: 44px; padding: 0; border: 0; background: none; cursor: pointer; max-width: 100%; }
.app-title-btn:disabled { cursor: default; }
.app-title-img { height: 40px; width: auto; max-width: min(240px, calc(100vw - 140px)); display: block; object-fit: contain; object-position: center; }
.header-slot { width: 44px; height: 44px; }
.header-back { border: 0; background: none; color: var(--fg); }
.header-back:hover { border: 0; color: var(--primary); }
.manual-item { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; background: var(--card); }
.manual-item p { flex: 1; min-width: 0; }
.manual-date { color: var(--muted); font-size: 0.8rem; }
.menu-pop { position: absolute; right: 12px; top: calc(100% - 4px); z-index: 21; min-width: 228px; padding: 6px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14); }
.menu-pop button { font: inherit; display: block; width: 100%; text-align: left; min-height: 44px; padding: 8px 12px; border: 0; border-radius: 8px; background: none; color: var(--fg); cursor: pointer; }
.menu-pop button:hover { background: var(--primary-soft); }
.menu-pop button.danger { color: var(--danger); }
.menu-pop button.danger:hover { background: #fdecea; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><filter id="ink-rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter></defs></svg>
<header id="app-header" hidden></header>
<main id="app"></main>
<nav id="tabbar" aria-label="メニュー" hidden></nav>
<noscript>このツールの利用にはJavaScriptが必要です。</noscript>

<script>
(() => {
'use strict';

/* =========================================================
 * 1. データ(先生が赤ペンを入れる部分)
 * ========================================================= */
const KEY_UNIVS = 'akahon-self-review:v3:univs';
const KEY_RECORDS = 'akahon-self-review:v3:records';
const KEY_PROMISES = 'akahon-self-review:v3:promises';
const KEY_WELCOME = 'akahon-self-review:v3:welcomed';
const KEY_SCHEDNAMES = 'akahon-self-review:v3:schednames';
const KEY_MANUAL = 'akahon-self-review:v3:manual';
/* v1・v2 の保存データ、削除した用語カードのデータ(v3 は読み込まない。「全部消す」のときだけ消す) */
const KEY_OLD = 'akahon-self-review:v1';
const KEY_CARDS = 'akahon-self-review:cards:v1';

/* 端末内(localStorage)の上限。件数そのものより、ブラウザの保存容量(目安5MB)のほうが先に効く */
const MAX_UNIVS = 20;
const MAX_SCHEDS = 5;
const MAX_SCHEDNAMES = 20;
const MAX_MANUAL = 10;
/* カレンダー(.ics)機能。Android での動作確認ができるまで見送り。true にすると画面に出る */
const ENABLE_CALENDAR = false;

const ROUNDS = [
  { id: '1', label: '1回目' }, { id: '2', label: '2回目' }, { id: '3', label: '3回目以降' }
];
const TIMES = [
  { id: 'ok', label: '余裕で、見直しまでできた' },
  { id: 'tight', label: 'ギリギリ終わった' },
  { id: 'unfinished', label: '時間が足りず、手がつかなかった大問があった' }
];
const LOSS = [
  { id: 'large', label: '大きく落とした' }, { id: 'mid', label: 'そこそこ' }, { id: 'small', label: '少しだけ' }
];
const LOSS_WEIGHT = { large: 3, mid: 2, small: 1 };
const TIME_WEIGHT = { ok: 0, tight: 1, unfinished: 3 };

/* =========================================================
 * 2. 判断ロジック(純粋関数)
 * ========================================================= */
const TAG_IDS = SCORE_TAGS;
const tagLabel = (id) => (TAGS.find((t) => t.id === id) || { label: id }).label;
const pickedTag = () => (state.pickedTag || (state.result && state.result.d ? state.result.d.primary : 'stable'));
const needsNextHand = (tag) => NEXT_HAND_TAGS.indexOf(tag) >= 0;
const hasWritingMissing = (a) => (a.misses || []).some((m) => m.reason === 'missing');
/* 論述の行き先。要素不足があればそれ。なければ、字数で浪費と日本語の乱れのうち、失点の大きいほう(同じなら字数) */
function writingKind(a) {
  if (hasWritingMissing(a)) return 'missing';
  let len = 0; let jp = 0;
  (a.misses || []).forEach((m) => {
    if (m.form !== 'writing') return;
    if (m.reason === 'length') len += LOSS_WEIGHT[m.loss] || 0;
    if (m.reason === 'japanese') jp += LOSS_WEIGHT[m.loss] || 0;
  });
  return jp > len ? 'japanese' : 'length';
}
const actionOf = (tag, a) => {
  if (tag === 'writing' && a) {
    const k = writingKind(a);
    if (k === 'length') return ACTIONS.writingLength;
    if (k === 'japanese') return ACTIONS.writingJapanese;
  }
  return ACTIONS[tag] || { title: '', short: '', why: '', steps: [], amount: '', goal: '' };
};
const findForm = (id) => FORMS.find((f) => f.id === id);
const findReason = (formId, reasonId) => {
  const f = findForm(formId);
  return f ? f.reasons.find((r) => r.id === reasonId) : undefined;
};

function calcScores(a) {
  const scores = {};
  TAG_IDS.forEach((t) => { scores[t] = 0; });
  a.misses.forEach((m) => {
    const r = findReason(m.form, m.reason);
    if (r) scores[r.tag] += LOSS_WEIGHT[m.loss] || 0;
  });
  scores.timeshort += TIME_WEIGHT[a.time] || 0;
  return scores;
}

function decide(a) {
  const scores = calcScores(a);
  const ranked = TAG_IDS
    .filter((t) => scores[t] > 0)
    .sort((x, y) => (scores[y] - scores[x]) || (TAG_IDS.indexOf(x) - TAG_IDS.indexOf(y)));
  return { scores, ranked, primary: ranked[0] || 'stable', secondary: ranked[1] || null };
}

const pct = (score, full) => Math.round((Number(score) / Number(full)) * 100);

/* 表記ゆれ対策: 全角半角・大文字小文字・空白をそろえる */
const nfkc = (s) => String(s || '').normalize('NFKC').replace(/\s+/g, '').toLowerCase();
/* 大学名: 「○○大学」「○○大」「○○」を同じとみなす */
const normUniv = (s) => {
  const k = nfkc(s).replace(/大学$/, '').replace(/大$/, '');
  return k || nfkc(s);
};
/* 日程名: 「T日程」「T」「Ｔ」「t」を同じとみなす */
const normSched = (s) => {
  const k = nfkc(s).replace(/日程$/, '');
  return k || nfkc(s);
};

function understandingReasons(a) {
  const ids = [];
  (a.misses || []).forEach((m) => {
    const r = findReason(m.form, m.reason);
    if (r && r.tag === 'understanding' && ids.indexOf(r.id) < 0) ids.push(r.id);
  });
  return ids;
}
function practiceOptions(a) {
  const out = []; const seen = {};
  understandingReasons(a).forEach((id) => {
    (PRACTICE_BY_REASON[id] || []).forEach((o) => {
      if (!seen[o.id]) { seen[o.id] = true; out.push(o); }
    });
  });
  if (!out.length) {
    ['no_mech', 'what', 'how'].forEach((id) => PRACTICE_BY_REASON[id].forEach((o) => {
      if (!seen[o.id]) { seen[o.id] = true; out.push(o); }
    }));
  }
  return out;
}
function optionLabel(list, id) {
  const hit = list.find((o) => o.id === id);
  return hit ? hit.label : '';
}
function actionView(tag, a) {
  const act = actionOf(tag, a);
  const steps = act.steps.slice();
  if (tag === 'understanding') {
    const confirm = optionLabel(CONFIRM_OPTS, a.confirm);
    const practice = optionLabel(practiceOptions(a), a.practice);
    if (a.confirm === 'ask') steps[0] = '先生に質問して、間違えた内容を確認する';
    else if (confirm) steps[0] = confirm + 'で、間違えた内容に関係する部分を確認する' + (a.confirm === 'video' ? '(関係する部分だけ)' : '');
    if (practice) {
      steps[1] = practice === '口頭説明'
        ? 'ノートを閉じて、口に出して説明する'
        : practice + 'の問題を解く。量は自分で決める';
    }
  }
  if (tag === 'knowledge') {
    const goal = optionLabel(KNOW_GOALS, a.knowGoal);
    if (goal) {
      steps[2] = '目標(' + goal + ')に届いたか確かめる';
    }
  }
  if (tag === 'understanding' && understandingReasons(a).indexOf('how') >= 0 && optionLabel(practiceOptions(a), a.practice) !== '口頭説明') {
    steps[2] = '何も見ずに解く。できなければ解法を見直し、2〜3日後にもう一度解き直す。解き方も説明できるまで繰り返す';
  }
  if (tag === 'reasoning') {
    if (a.seen === 'yes') steps[0] = '授業で扱った教材に戻り、その問題を確認する';
    if (a.seen === 'no') steps[0] = '赤本の解説を読む';
  }
  if (tag === 'writing' && hasWritingMissing(a)) {
    if (WKIND_STEP[a.wkind]) steps[0] = WKIND_STEP[a.wkind];
    if (a.seen === 'yes') steps[1] = '該当する教材の問題を解き直す';
    if (a.seen === 'no') steps[1] = '自分の答案と模範解答を比べて、足りなかった要素を確認する';
  }
  return {
    title: act.title, short: act.short, why: act.why, steps,
    amount: act.amount,
    goal: (tag === 'knowledge' && a.knowGoal) ? ('目標(' + optionLabel(KNOW_GOALS, a.knowGoal) + ')を達成できた') : act.goal
  };
}
/* 約束の「やること」に最初から入れる文。生徒が選んだ教材・目標、または入力した次への一手を、そのまま使う。
 * 手順の説明は結果の上の欄に出ているので、ここでは足さない。選ぶ前・入力前は、課題の見出しを入れる */
function promiseText(tag, a) {
  const act = actionView(tag, a);
  if (tag === 'understanding') {
    const confirm = optionLabel(CONFIRM_OPTS, a.confirm);
    const practice = optionLabel(practiceOptions(a), a.practice);
    const parts = [];
    if (a.confirm === 'ask') parts.push('先生に質問する');
    else if (confirm) parts.push(confirm + 'で確認する');
    if (practice) parts.push(practice === '口頭説明' ? '口頭で説明する' : practice + 'の問題を解く');
    return parts.length ? parts.join(' → ') : act.title;
  }
  if (tag === 'knowledge') {
    const phrase = KNOW_GOAL_PHRASE[a.knowGoal];
    return phrase ? 'ミニテ集で' + phrase + 'まで繰り返す' : act.title;
  }
  if (needsNextHand(tag)) {
    const next = String(a.next || '').trim();
    return next || act.title;
  }
  if (tag === 'writing') {
    const kind = writingKind(a);
    if (kind === 'length') return act.steps.join(' → ');
    if (kind === 'japanese') return act.short;
    const parts = [];
    if (WKIND_STEP[a.wkind]) parts.push(act.steps[0]);
    if (a.seen) parts.push(act.steps[1]);
    return parts.length ? parts.join(' → ') : act.title;
  }
  return act.title;
}
function nextHandPrompt(tag) {
  if (tag === 'reasoning') return '次に同じような問題が出たら、どう解く？';
  if (tag === 'calc') return '次に同じミスをしないための対策は？';
  if (tag === 'careless') return '次に同じミスをしないための具体的な行動は？';
  if (tag === 'timeshort') return '次の赤本で変える行動は？';
  return '次への一手';
}
function nextHandHint(tag) {
  if (tag === 'reasoning') return '例: 実験群と対照群で異なる条件に印をつける';
  if (tag === 'careless') return '例: 「正しいもの」「誤っているもの」の指示に丸をつける';
  return '手の動かし方・読み方など、具体的な行動を1文で';
}

/* 日付・日時。when は '' (あとで決める) / 'YYYY-MM-DD' (日付だけ) / 'YYYY-MM-DDTHH:MM' */
const pad = (n) => String(n).padStart(2, '0');
const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toLocalIso = (d) => `${toDateStr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const todayStr = () => toDateStr(new Date());
const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
function parseDateStr(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
  if (!m) return null;
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return Number.isNaN(d.getTime()) ? null : d;
}
function fmtDate(s) {
  const d = parseDateStr(s);
  return d ? `${d.getMonth() + 1}/${d.getDate()}(${WEEK[d.getDay()]})` : '';
}
function fmtWhen(when) {
  if (!when) return 'あとで決める';
  if (when.length <= 10) return fmtDate(when);
  return `${fmtDate(when)} ${when.slice(11, 16)}`;
}
/* 「次の赤本を解いているとき」を選んだ約束は日付を持たず、whenNext が true になる */
const WHEN_NEXT = 'next';
const WHEN_NEXT_LABEL = '次の赤本を解いているとき';
function whenLabel(p) {
  if (p.when) return fmtWhen(p.when);
  return p.whenNext ? WHEN_NEXT_LABEL : fmtWhen('');
}
function isDue(p) {
  /* 次の赤本の約束は、次の記録(別の赤本)ができてから「達成できましたか?」に出す */
  if (p.whenNext) return loadRecs().some((r) => r.id !== p.recordId && r.ts > p.createdAt);
  if (!p.when) return true;
  if (p.when.length <= 10) return p.when <= todayStr();
  return p.when <= toLocalIso(new Date());
}
function whenOptions() {
  const now = new Date();
  const at = (off) => toDateStr(new Date(now.getFullYear(), now.getMonth(), now.getDate() + off));
  return [
    { id: at(0), label: '今日' },
    { id: at(1), label: '明日' },
    { id: at(3), label: '3日以内' },
    { id: at(7), label: '1週間以内' },
    { id: WHEN_NEXT, label: '次の赤本を解いているとき' }
  ];
}
/* 選んだ内容から when を作る。未選択・不正のときは null */
function composeWhen(st) {
  if (st.whenOpt === 'later' || st.whenOpt === WHEN_NEXT) return '';
  const date = st.whenOpt === 'custom' ? st.date : st.whenOpt;
  if (!date || !parseDateStr(date)) return null;
  return st.time ? `${date}T${st.time}` : date;
}
function whenError(st) {
  if (!st.whenOpt) return 'いつやるか、選んでください。';
  return '';
}

/* カレンダー(.ics)。日付だけなら終日の予定、時刻があれば15分の予定 */
const icsEscape = (s) => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const icsStamp = (iso) => iso.replace(/[-:]/g, '') + '00';
function buildIcs(p) {
  const uid = `akahon-${Date.now()}-${Math.random().toString(36).slice(2, 8)}@local`;
  const allDay = p.when.length <= 10;
  const when = [];
  if (allDay) {
    const start = parseDateStr(p.when);
    const next = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1);
    when.push(`DTSTART;VALUE=DATE:${p.when.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${toDateStr(next).replace(/-/g, '')}`);
  } else {
    const start = new Date(p.when);
    const end = new Date(start.getTime() + 15 * 60000);
    when.push(`DTSTART:${icsStamp(p.when)}`, `DTEND:${icsStamp(toLocalIso(end))}`);
  }
  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//akahon-self-review//JA', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${icsStamp(toLocalIso(new Date()))}`,
    ...when,
    `SUMMARY:${icsEscape('生物の約束: ' + (actionOf(p.tag).title || ''))}`,
    `DESCRIPTION:${icsEscape(p.text)}`,
    'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape('生物の約束の時間です')}`,
    allDay ? 'TRIGGER:PT9H' : 'TRIGGER:-PT5M',
    'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ];
  return lines.join('\r\n');
}

function readJson(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function writeJson(key, arr) {
  try { localStorage.setItem(key, JSON.stringify(arr)); return true; } catch (e) { return false; }
}
function clearKey(key) { try { localStorage.removeItem(key); } catch (e) { /* noop */ } }
const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const loadUnivs = () => readJson(KEY_UNIVS);
const saveUnivs = (arr) => writeJson(KEY_UNIVS, arr);
const loadRecs = () => readJson(KEY_RECORDS).sort((x, y) => x.ts - y.ts);
const saveRecs = (arr) => writeJson(KEY_RECORDS, arr);
const loadProms = () => readJson(KEY_PROMISES);
const saveProms = (arr) => writeJson(KEY_PROMISES, arr);
function loadManual() {
  try {
    const raw = localStorage.getItem(KEY_MANUAL);
    if (!raw) return { goods: [], nexts: [] };
    const o = JSON.parse(raw);
    return {
      goods: Array.isArray(o.goods) ? o.goods : [],
      nexts: Array.isArray(o.nexts) ? o.nexts : []
    };
  } catch (e) { return { goods: [], nexts: [] }; }
}
function saveManual(m) {
  try { localStorage.setItem(KEY_MANUAL, JSON.stringify(m)); return true; } catch (e) { return false; }
}
function addManualLine(kind, text, recordId) {
  const t = String(text || '').trim();
  if (!t) return true;
  const m = loadManual();
  m[kind].unshift({ id: newId('m'), text: t, ts: Date.now(), recordId: recordId || '' });
  m[kind] = m[kind].slice(0, MAX_MANUAL);
  return saveManual(m);
}
function removeManualLine(kind, id) {
  const m = loadManual();
  m[kind] = m[kind].filter((x) => x.id !== id);
  return saveManual(m);
}
function flushManual() {
  const good = String(state.a.good || '').trim();
  const next = String(state.a.next || '').trim();
  const rec = currentRecord();
  const id = rec ? rec.id : '';
  const prev = state.manualFlushed || { good: '', next: '' };
  if (good && good !== prev.good) addManualLine('goods', good, id);
  if (next && next !== prev.next) addManualLine('nexts', next, id);
  state.manualFlushed = { good, next };
}

/* 入試日程の名前を、この端末に覚えておく(次回から候補に出す)。表記ゆれ(T / T日程 / Ｔ)は同じとみなす */
function rememberSched(name) {
  const n = String(name || '').trim();
  if (!n) return;
  const list = readJson(KEY_SCHEDNAMES).filter((x) => typeof x === 'string');
  if (list.some((x) => normSched(x) === normSched(n))) return;
  list.unshift(n);
  writeJson(KEY_SCHEDNAMES, list.slice(0, MAX_SCHEDNAMES));
}
/* 日程名の候補。覚えてある名前と、登録済みの大学の日程名。入力中なら、近いものだけ */
function schedCandidates(typed) {
  const names = []; const seen = new Set();
  const add = (n) => {
    const k = normSched(n);
    if (typeof n === 'string' && n && !seen.has(k)) { seen.add(k); names.push(n); }
  };
  readJson(KEY_SCHEDNAMES).forEach(add);
  loadUnivs().forEach((u) => u.scheds.forEach((s) => add(s.name)));
  const q = normSched(typed);
  return q ? names.filter((n) => normSched(n).includes(q) && normSched(n) !== q) : names;
}

const getUniv = (id) => loadUnivs().find((u) => u.id === id);
function updateUniv(id, patch) {
  const arr = loadUnivs();
  const i = arr.findIndex((u) => u.id === id);
  if (i < 0) return false;
  arr[i] = Object.assign({}, arr[i], patch);
  return saveUnivs(arr);
}
function updateRec(id, patch) {
  const arr = loadRecs();
  const i = arr.findIndex((e) => e.id === id);
  if (i < 0) return false;
  arr[i] = Object.assign({}, arr[i], patch);
  return saveRecs(arr);
}
function updateProm(id, patch) {
  const arr = loadProms();
  const i = arr.findIndex((p) => p.id === id);
  if (i < 0) return null;
  arr[i] = Object.assign({}, arr[i], patch);
  saveProms(arr);
  return arr[i];
}

/* 日程を確定する。同じ名前(表記ゆれ込み)があればそれを使い、なければ追加する */
function matchSched(univ, name) {
  const key = normSched(name);
  return univ.scheds.find((s) => normSched(s.name) === key);
}
function resolveSched(univ, a) {
  const name = a.sched.trim();
  if (!name) return '';
  const hit = matchSched(univ, name);
  if (hit) return hit.id;
  const sched = { id: newId('s'), name };
  updateUniv(univ.id, { scheds: univ.scheds.concat([sched]) });
  return sched.id;
}

function makeEntry(a, d, univ, schedId) {

function recLabel(r, univs) {
  const u = (univs || loadUnivs()).find((x) => x.id === r.univId);
  const s = u ? u.scheds.find((x) => x.id === r.schedId) : null;
  return `${u ? u.name : '(消した大学)'} ${r.year}年${s ? '・' + s.name : ''}`;
}
function latestPromiseOf(proms, recordId) {
  const list = proms.filter((p) => p.recordId === recordId && p.kind !== 'review').sort((x, y) => x.createdAt - y.createdAt);
  return list.length ? list[list.length - 1] : null;
}

function markerSvg(shape, cx, cy, color, hollow, r) {
  const rr = r || 5;
  const c = `fill="${hollow ? '#ffffff' : color}" stroke="${color}" stroke-width="2"`;
  if (shape === 'square') return `<rect x="${cx - rr}" y="${cy - rr}" width="${rr * 2}" height="${rr * 2}" ${c}/>`;
  if (shape === 'triangle') return `<polygon points="${cx},${cy - rr - 1} ${cx + rr + 1},${cy + rr} ${cx - rr - 1},${cy + rr}" ${c}/>`;
  if (shape === 'diamond') return `<polygon points="${cx},${cy - rr - 1} ${cx + rr + 1},${cy} ${cx},${cy + rr + 1} ${cx - rr - 1},${cy}" ${c}/>`;
  if (shape === 'hex') {
    const pts = [0, 1, 2, 3, 4, 5].map((k) => `${(cx + (rr + 1) * Math.cos((Math.PI / 3) * k)).toFixed(1)},${(cy + (rr + 1) * Math.sin((Math.PI / 3) * k)).toFixed(1)}`).join(' ');
    return `<polygon points="${pts}" ${c}/>`;
  }
  if (shape === 'cross') {
    const a = rr + 1; const b = 1.8;
    const pts = [[-b, -a], [b, -a], [b, -b], [a, -b], [a, b], [b, b], [b, a], [-b, a], [-b, b], [-a, b], [-a, -b], [-b, -b]]
      .map((p) => `${cx + p[0]},${cy + p[1]}`).join(' ');
    return `<polygon points="${pts}" ${c}/>`;
  }
  return `<circle cx="${cx}" cy="${cy}" r="${rr}" ${c}/>`;
}

/* 大学の記録から、日程ごとの系列を作る。同じ年度・日程は新しいほうを使う */
function buildSeries(univ, recs, draft) {
  const bySeries = new Map();
  const put = (key, year, v, isDraft) => {
    if (!bySeries.has(key)) bySeries.set(key, new Map());
    bySeries.get(key).set(year, { year, v, draft: isDraft });
  };
  recs.forEach((r) => put(r.schedId || '', r.year, pct(r.score, r.full), false));
  if (draft) put(draft.schedKey, draft.year, draft.v, true);
  const order = [];
  if (bySeries.has('')) order.push('');
  univ.scheds.forEach((s) => { if (bySeries.has(s.id)) order.push(s.id); });
  bySeries.forEach((_, k) => { if (!order.includes(k)) order.push(k); });
  const series = order.map((key) => {
    const idx = univ.scheds.findIndex((s) => s.id === key);
    let name; let styleIndex;
    if (key === '') {
      name = order.length > 1 ? '日程なし' : '';
      styleIndex = order.length > 1 ? 5 : 0;
    } else if (idx >= 0) {
      name = univ.scheds[idx].name; styleIndex = Math.min(idx, 4);
    } else {
      name = draft ? draft.schedName : ''; styleIndex = Math.min(univ.scheds.length, 4);
    }
    const points = [...bySeries.get(key).values()].sort((x, y) => x.year - y.year);
    return { key, name, style: SERIES_STYLES[styleIndex], points };
  });
  const years = [...new Set(series.flatMap((s) => s.points.map((p) => p.year)))].sort((x, y) => x - y);
  return { series, years };
}

function chartHtml(model, target) {
  const { series, years } = model;
  const W = 320, H = 210, L = 36, R = 14, T = 16, B = 36;
  const iw = W - L - R, ih = H - T - B;
  const x = (yr) => (years.length === 1 ? L + iw / 2 : L + (iw * years.indexOf(yr)) / (years.length - 1));
  const y = (v) => T + ih * (1 - Math.max(0, Math.min(100, v)) / 100);
  const grid = [0, 25, 50, 75, 100].map((v) => `<line x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}" stroke="#d5ddd8" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#55645c">${v}</text>`).join('');
  const tl = target != null
    ? `<line x1="${L}" y1="${y(target)}" x2="${W - R}" y2="${y(target)}" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/><text x="${W - R}" y="${y(target) - 5}" text-anchor="end" font-size="11" font-weight="700" fill="#b3261e">目標 ${target}%</text>`
    : '';
  const body = series.map((s, si) => {
    const line = s.points.length > 1
      ? `<polyline points="${s.points.map((p) => `${x(p.year)},${y(p.v)}`).join(' ')}" fill="none" stroke="${s.style.color}" stroke-width="2"/>`
      : '';
    const marks = s.points.map((p) => {
      const cx = x(p.year); const cy = y(p.v);
      const above = si % 2 === 0 && cy - 10 > T - 4;
      const ty = above ? cy - 10 : cy + 19;
      return `<g>${markerSvg(s.style.shape, cx, cy, s.style.color, p.draft)}<title>${esc((s.name ? s.name + ' ' : '') + p.year + '年: ' + p.v + '%')}</title></g><text x="${cx}" y="${ty}" text-anchor="middle" font-size="10" fill="${s.style.color}" font-weight="700">${p.v}%</text>`;
    }).join('');
    return line + marks;
  }).join('');
  const xl = years.map((yr) => `<text x="${x(yr)}" y="${H - B + 16}" text-anchor="middle" font-size="10" fill="#55645c">${yr}</text>`).join('');
  const desc = series.map((s) => (s.name ? s.name + ': ' : '') + s.points.map((p) => p.year + '年は' + p.v + '%').join('、')).join('。');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="正答率の推移。${esc(desc)}${target != null ? '。目標は' + target + '%' : ''}">${grid}${tl}${body}${xl}</svg>`;
}

function legendHtml(series) {
  if (series.length === 1 && !series[0].name) return '';
  return `<div class="legend" aria-label="日程の凡例">${series.map((s) => (
    `<span class="item"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">${markerSvg(s.style.shape, 8, 8, s.style.color, false, 4)}</svg>${esc(s.name || '正答率')}</span>`
  )).join('')}</div>`;
}

/* --- 約束ページ(未完了 / もう少し / 完了 で絞り込み) --- */
const PROM_GROUPS = [
  { id: 'todo', label: '未完了' },
  { id: 'partial', label: 'もう少し' },
  { id: 'done', label: '完了' }
];
/* 手放した・再約束した約束は、一覧に出さない(先生の画面には履歴として残る) */
const promGroup = (p) => (p.status === 'open' || p.status === 'held' ? 'todo' : (p.status === 'done' ? 'done' : (p.status === 'partial' ? 'partial' : '')));
const PROM_EMPTY = {
  todo: '未完了の約束はありません。',
  done: 'まだ完了した約束はありません。「やった」を記録すると、ここにスタンプが並びます。',
  partial: '「一部だけやった」約束が、ここに並びます。'
};
function renderPromises() {
  const univs = loadUnivs(); const recs = loadRecs(); const proms = loadProms();
  const groups = { todo: [], done: [], partial: [] };
  proms.forEach((p) => { const g = promGroup(p); if (g) groups[g].push(p); });
  /* 未完了は、確認待ち → 保留中の順。どれも新しい約束が上 */
  groups.todo.sort((x, y) => (x.status === y.status ? y.createdAt - x.createdAt : (x.status === 'open' ? -1 : 1)));
  groups.done.sort((x, y) => y.createdAt - x.createdAt);
  groups.partial.sort((x, y) => y.createdAt - x.createdAt);
  const f = groups[state.promFilter] ? state.promFilter : 'todo';
  const heldCount = groups.todo.filter((p) => p.status === 'held').length;
  return `
    <div class="stack">
      <h1 tabindex="-1">約束</h1>
      ${state.promMsg ? `<div class="notice" role="status">${esc(state.promMsg)}</div>` : ''}
      <div class="seg" role="group" aria-label="約束の絞り込み">
        ${PROM_GROUPS.map((g) => `<button class="seg-btn seg-${g.id}" data-action="prom-filter" data-id="${g.id}" aria-pressed="${f === g.id}">${g.label}<span class="seg-n">${groups[g.id].length}</span></button>`).join('')}
      </div>
      ${f === 'todo' && heldCount ? `
      <section class="card stack-sm">
        <div class="row-between nowrap-row">
          <p style="margin:0"><strong>未回答の約束があります</strong></p>
          <button class="icon-btn" data-action="toggle-hold" aria-expanded="${state.holdOpen}" aria-controls="hold-body" aria-label="${state.holdOpen ? '未回答の約束を閉じる' : '未回答の約束を開く'}">${state.holdOpen ? ICON_CHEV_UP : ICON_CHEV_DOWN}</button>
        </div>
        ${state.holdOpen ? `<div id="hold-body" class="stack">${heldItemsHtml(proms.filter((p) => p.status === 'held').sort((x, y) => x.createdAt - y.createdAt), recs, univs)}</div>` : ''}
      </section>` : ''}
      ${groups[f].length === 0 ? `<p class="notice">${esc(PROM_EMPTY[f])}</p>` : ''}
      ${groups[f].map((p) => {
        const rec = recs.find((r) => r.id === p.recordId);
        const reason = (FU_REASONS.find((x) => x.id === p.reason) || {}).label;
        const openable = p.status === 'open' || p.status === 'held' || p.status === 'partial';
        const opened = openable && state.fuOpenId === p.id;
        return `
        <section class="stack-sm">
          <p class="muted">${esc(rec ? recLabel(rec, univs) : '')}</p>
          <div class="prom-pick${opened ? ' dim' : ''}" ${openable ? `data-action="open-followup" data-id="${esc(p.id)}"` : ''}>
            ${scrapHtml(p, { animate: p.id === state.stampedId })}
          </div>
          ${(p.status === 'partial' || p.status === 'held') && reason ? `<p class="muted">理由: ${esc(reason)}</p>` : ''}
          ${opened ? `<div class="follow-btns">
            <button type="button" class="btn btn-sm" data-action="quick-followup" data-id="${esc(p.id)}" data-status="done">やった</button>
            <button type="button" class="btn btn-sm" data-action="quick-followup" data-id="${esc(p.id)}" data-status="partial">一部だけやった</button>
            <button type="button" class="btn btn-sm" data-action="quick-followup" data-id="${esc(p.id)}" data-status="none">未完了</button>
          </div>` : ''}
        </section>`;
      }).join('')}
    </div>`;
}

/* 紙吹雪。外部ライブラリなし、CSSだけで動かす。動きを減らす設定の端末では、CSSで隠す */
const CONFETTI_COLORS = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa', '#ec407a'];
function confettiHtml() {
  const n = 30;
  let out = '';
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2;
    const dx = Math.round(Math.cos(ang) * (50 + (i % 5) * 16));
    const up = 30 + (i % 4) * 14;
    const fall = 70 + (i % 6) * 12;
    const rot = (i % 2 ? 1 : -1) * (240 + (i % 7) * 60);
    const delay = (i % 6) * 0.04;
    out += `<i style="--dx:${dx}px;--up:${up}px;--fall:${fall}px;--rot:${rot}deg;background:${CONFETTI_COLORS[i % CONFETTI_COLORS.length]};animation-delay:${delay}s"></i>`;
  }
  return `<span class="confetti" aria-hidden="true">${out}</span>`;
}

function renderTabbar() {
  const bar = document.getElementById('tabbar');
  if (!bar) return;
  const hidden = NAV_HIDDEN_STEPS.includes(state.step);
  document.body.classList.toggle('has-tabbar', !hidden);
  bar.hidden = hidden;
  if (hidden) { bar.innerHTML = ''; return; }
  const proms = loadProms();
  const todoN = proms.filter((p) => p.status === 'open' || p.status === 'held').length;
  const partN = proms.filter((p) => p.status === 'partial').length;
  const cur = state.step;
  const onProm = cur === 'promises' || cur === 'hold';
  const onMan = cur === 'manual';
  const bits = [];
  if (todoN) bits.push('未完了' + todoN + '件');
  if (partN) bits.push('もう少し' + partN + '件');
  const badges = (todoN || partN) ? `<span class="tab-badges" aria-hidden="true">${todoN ? `<b class="tab-badge">${todoN > 9 ? '9+' : todoN}</b>` : ''}${partN ? `<b class="tab-badge blue">${partN > 9 ? '9+' : partN}</b>` : ''}</span>` : '';

function render(opts) {
  if (!VIEWS[state.step]) state.step = 'intro';
  if (state.step !== 'intro') { state.univEdit = null; state.univEditError = ''; }
  if (state.step !== 'univ') { state.recOpenId = ''; state.recEdit = null; state.recEditError = ''; }
  app.innerHTML = VIEWS[state.step]();
  renderHeader();
  renderTabbar();
  if (opts && opts.focusSelector) {
    const el = app.querySelector(opts.focusSelector);
    if (el) el.focus();
  } else if (opts && opts.focusTop) {
    const h = app.querySelector('h1');
    if (h) h.focus();
    window.scrollTo(0, 0);
  }
}
/* 画面を切り替える。ブラウザの「戻る」でも前の画面にもどれるように、履歴に積む */
function goto(step) {
  /* 入力の修正に戻るときは、トリセツへまだ書かない */
  if (state.step === 'result' && step !== 'result' && STEPS.indexOf(step) < 0) flushManual();
  state.step = step;
  state.error = '';
  state.stampedId = ''; state.promMsg = ''; state.fuOpenId = '';
  try { history.pushState({ step, univId: state.univId }, '', '#' + step); } catch (e) { /* noop */ }
  render({ focusTop: true });
}
function guardStep(step) {
  if (!isWelcomed()) return 'welcome';
  if (step === 'welcome') return 'intro';
  if (STEPS.includes(step) && !state.started) return 'intro';
  if (step === 'result' && !state.result) return 'intro';
  if (step === 'univ' && !getUniv(state.univId)) return 'intro';
  return VIEWS[step] ? step : 'intro';
}
window.addEventListener('popstate', (e) => {
  const s = e.state;
  if (s && s.univId) state.univId = s.univId;
  state.step = guardStep(s && s.step ? s.step : 'intro');
  render({ focusTop: true });
});
const radioSel = (t) => `input[name="${t.name}"][value="${t.value}"]`;

/* =========================================================
 * 7. 入力チェック
 * ========================================================= */
function validate(step) {
  const a = state.a;
  if (step === 'basic') {
    const univ = getUniv(state.univId);
    if (a.year === '') return '解いた年度を入れてください。';
    const y = Number(a.year);
    if (!(/^\d{4}$/.test(a.year) && y >= 2000 && y <= 2100)) return '年度は、西暦4桁の数字で入力してください。(例: 2025)';
    const name = a.sched.trim();
    if (name && !matchSched(univ, name) && univ.scheds.length >= MAX_SCHEDS) {
      return `この大学の入試日程は${MAX_SCHEDS}つまでです。すでにある日程の名前を使ってください。`;
    }
    if (a.full === '') return '全問題数を入力してください。';
    if (a.score === '') return '正答数を入力してください。';
    const s = Number(a.score);
    const f = Number(a.full);
    if (!(f >= 1)) return '全問題数は、1以上の数字を入力してください。';
    if (!(s >= 0) || s > f) return '正答数は、0以上で全問題数以下の数字を入力してください。';
  }
  if (step === 'time' && !a.time) return '当てはまるものを選んでください。';
  if (step === 'misses') {
    for (let i = 0; i < a.misses.length; i++) {
      const m = a.misses[i];
      if (!m.form) return `設問${i + 1}: どんな問題だったか選んでください。`;
      if (!m.reason) return `設問${i + 1}: 理由を選んでください。`;
      if (!m.loss) return `設問${i + 1}: どのくらい落としたか選んでください。`;
    }
  }
  return '';
}

/* =========================================================
 * 8. イベント
 * ========================================================= */
async function copyText(text, fallbackId) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = fallbackId ? document.getElementById(fallbackId) : null;
    if (!ta) return false;
    ta.focus(); ta.select();
    try { return document.execCommand('copy'); } catch (e2) { return false; }
  }
}
function downloadText(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function setStatus(id, msg) {
  const el = document.getElementById(id);
  if (el) el.textContent = msg;
}
function makePromise(recordId, tag, scope, text, first, when, parentId) {
  return {
    id: newId('p'), recordId, tag, scope, text, first, when,
    createdAt: Date.now(), status: 'open', reason: '', answeredAt: null, parentId: parentId || ''
  };
}
/* 今回の記録を保存して返す。結果が出たときに自動で呼ぶ。
 * 結果画面から入力にもどって出し直したときは、新しく増やさず、同じ記録を上書きする */
function ensureRecord() {
  const univ = getUniv(state.univId);
  const schedId = resolveSched(univ, state.a);
  const entry = makeEntry(state.a, state.result.d, univ, schedId);
  const all = loadRecs();

    render();
  } else if (act === 'quick-followup') {
    const status = btn.dataset.status;
    const id = btn.dataset.id;
    if (status === 'none') {
      updateProm(id, { status: 'open', reason: '', answeredAt: null });
      state.fuOpenId = '';
      showPromises({ filter: 'todo' });
    } else {
      updateProm(id, { status, reason: '', answeredAt: Date.now() });
      state.fuOpenId = '';
      showPromises({
        filter: status === 'done' ? 'done' : 'partial',
        stampedId: id
      });
    }
  } else if (act === 'close-followup') {
    state.fuOpenId = ''; state.followupError = '';
    render();
  } else if (act === 'open-repromise') {
    const p = loadProms().find((x) => x.id === btn.dataset.id);
    if (!p) return;
    const text = p.text || '';
    state.repromise = newWhenState({ id: p.id, text, base: text });
    state.repromiseError = '';
    render();
  } else if (act === 'cancel-repromise') {
    state.repromise = null; state.repromiseError = '';
    render();
  } else if (act === 'confirm-repromise') {
    const st = state.repromise;
    const old = loadProms().find((x) => x.id === st.id);
    const err = whenError(st);
    const text = st.text.trim();
    if (err) { state.repromiseError = err; render(); return; }
    if (!text) { state.repromiseError = 'やることを入れてください。'; render(); return; }
    if (!old) return;
    const np = makePromise(old.recordId, old.tag, 'all', text, '', composeWhen(st) || '', old.id);
    if (st.whenOpt === WHEN_NEXT) np.whenNext = true;
    const proms = loadProms().map((x) => (x.id === old.id ? Object.assign({}, x, { status: 'replaced' }) : x));
    proms.push(np);
    saveProms(proms);
    state.repromise = null; state.repromiseError = '';
    showPromises({
      filter: 'todo',
      msg: np.when ? `約束しました(${fmtWhen(np.when)})。` : (np.whenNext ? `約束しました(${WHEN_NEXT_LABEL})。` : '約束しました。日付は、約束のページであとから決められます。')
    });
  } else if (act === 'release') {
    if (window.confirm('この約束を手放します。記録には残りますが、未完了の一覧から外れます。よろしいですか?')) {
      updateProm(btn.dataset.id, { status: 'released' });
      if (state.step === 'promises') {
        showPromises({ filter: 'todo', msg: '手放しました。手放すのも、ひとつの選び方です。' });
      } else {
        state.holdMsg = '手放しました。手放すのも、ひとつの選び方です。';
        render({ focusTop: true });
      }
    }
  } else if (act === 'open-about') {
    goto('about');
  } else if (act === 'remove-manual') {
    removeManualLine(btn.dataset.kind, btn.dataset.id);
    render();
  }
};
app.addEventListener('click', onClick);
document.getElementById('tabbar').addEventListener('click', onClick);
document.getElementById('app-header').addEventListener('click', onClick);
document.addEventListener('click', (e) => {
  let changed = false;
  if (state.menuOpen && !e.target.closest('#app-header')) {
    state.menuOpen = false;
    changed = true;
  }
  if (state.step === 'univ' && state.recOpenId && !e.target.closest('tr.rec-row, tr.rec-actions')) {
    state.recOpenId = '';
    state.recEdit = null;
    state.recEditError = '';
    changed = true;
    render();
    return;
  }
  if (changed) renderHeader();
});
app.addEventListener('keydown', (e) => {
  const row = e.target.closest('tr.rec-row');
  if (!row || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault();
  row.click();
});

/* 数字だけの欄(年度・全問題数・正答数)。全角数字は半角にして、数字以外は取り除く */
const DIGIT_MAX = { year: 4, full: 3, score: 3 };
function cleanDigitValue(raw, key) {
  const max = DIGIT_MAX[key];
  if (!max) return raw;
  return String(raw).normalize('NFKC').replace(/\D/g, '').slice(0, max);
}
function cleanDigits(t) {
  const key = t.dataset.text;
  if (!(key in DIGIT_MAX)) return;
  const v = cleanDigitValue(t.value, key);
  if (v !== t.value) t.value = v;
}
/* 「大学」だけが入っている欄は、最初にタップしたとき、カーソルを「大学」の前に置く */
app.addEventListener('focusout', (e) => {
  const t = e.target;
  if (t.matches && t.matches('[data-text="year"]')) {
    state.yearChecked = true;
    const msg = (state.basicTried && t.value === '') ? '解いた年度を入れてください。' : yearFormatError(t.value);
    const bad = !!msg;
    t.classList.toggle('invalid', bad);
    if (bad) t.setAttribute('aria-invalid', 'true'); else t.removeAttribute('aria-invalid');
    const box = document.getElementById('year-error');
    if (box) { box.hidden = !msg; box.textContent = msg; }
  }
});
app.addEventListener('focusin', (e) => {
  const t = e.target;
  if (t.matches && t.matches('[data-uf="name"]') && t.value === UNIV_SUFFIX) {
    setTimeout(() => { try { t.setSelectionRange(0, 0); } catch (err) { /* noop */ } }, 0);
  } else if (t.matches && t.matches('[data-text="sched"]')) {
    updateSchedSuggest();
  }
});

app.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-text]')) {
    cleanDigits(t);
    state.a[t.dataset.text] = t.value;
  } else if (t.matches('[data-re]')) {
    if (t.dataset.re in DIGIT_MAX) {
      const v = cleanDigitValue(t.value, t.dataset.re);
      if (v !== t.value) t.value = v;
    }
    if (state.recEdit) state.recEdit[t.dataset.re] = t.value;
  } else if (t.matches('[data-bind]')) {
    state.a[t.dataset.bind] = t.value;
    state.error = '';
  } else if (t.matches('[data-miss]:not([data-text-miss])')) {
    const m = state.a.misses[Number(t.dataset.miss)];
    const key = t.dataset.key;
    m[key] = t.value;
    state.error = '';
    if (key === 'form') { m.reason = ''; render({ focusSelector: radioSel(t) }); }
  } else if (t.matches('[data-pr]') && t.type === 'radio') {
    const st = whenTarget(t.dataset.prt);
    st[t.dataset.pr] = t.value;
    if (t.dataset.prt === 'repromise') state.repromiseError = ''; else state.promiseError = '';
    render({ focusSelector: radioSel(t) });
  } else if (t.matches('[data-pick]')) {
    state.pickedTag = t.value;
    state.a.seen = ''; state.a.wkind = ''; state.a.knowGoal = ''; state.a.confirm = ''; state.a.practice = '';
    /* ひな形を選んでいたら、別の課題の文が残らないように消す(自分で書いた文は残す) */
    if (state.a.nhPick && state.a.nhPick !== NH_OWN) state.a.next = '';
    state.a.nhPick = '';
    state.promiseError = '';
    refreshPromiseText();
    if (state.savedId) updateRec(state.savedId, { primary: t.value });
    render({ focusSelector: radioSel(t) });
  } else if (t.matches('[data-review]')) {
    state.reviewOpt = t.value === 'none' ? '' : t.value;
    render({ focusSelector: radioSel(t) });
  } else if (t.matches('[data-nh]')) {
    const a = state.a;
    a.nhPick = t.value;
    if (t.value === NH_OWN) a.next = '';
    else a.next = (NEXT_HAND_CHIPS[pickedTag()] || [])[Number(t.value.slice(1))] || '';
    state.promiseError = '';
    refreshPromiseText();
    render({ focusSelector: t.value === NH_OWN ? '[data-text="next"]' : radioSel(t) });
  } else if (t.matches('[data-ch]')) {
    state.a[t.dataset.ch] = t.value;
    state.promiseError = '';
    refreshPromiseText();
    render({ focusSelector: radioSel(t) });
  } else if (t.matches('[data-fu]')) {
    state.followup[t.dataset.fu] = t.value;
    state.followupError = '';
    if (t.dataset.fu === 'status') { state.followup.reason = ''; render({ focusSelector: radioSel(t) }); }
  }
});

app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-text]')) {
    if (!e.isComposing) cleanDigits(t);
    state.a[t.dataset.text] = t.value;
    if (t.dataset.text === 'sched') updateSchedSuggest();
    /* 次への一手を入力したら、約束の「やること」にも(自分で書き換える前なら)すぐ反映する */
    if (t.dataset.text === 'next' && state.step === 'result') {
      /* ひな形から書き換えたら、「自分で入力する」に切り替える */
      const chip = (NEXT_HAND_CHIPS[pickedTag()] || [])[Number(String(state.a.nhPick).slice(1))];
      if (state.a.nhPick && state.a.nhPick !== NH_OWN && t.value !== chip) {
        state.a.nhPick = NH_OWN;
        const own = app.querySelector(`input[name="nh"][value="${NH_OWN}"]`);
        if (own) own.checked = true;
      }
    }
    if (t.dataset.text === 'next' && state.step === 'result' && state.promise && !state.savedPromise) {
      refreshPromiseText();
      const box = app.querySelector('[data-pr="text"][data-prt="promise"]');
      if (box && !state.promise.edited) box.value = state.promise.text;
    }
    if (t.dataset.text === 'year' && (t.value.length === 4 || state.yearChecked || state.basicTried)) {
      const msg = (state.basicTried && t.value === '') ? '解いた年度を入れてください。' : yearFormatError(t.value);
      const bad = !!msg;
      t.classList.toggle('invalid', bad);
      if (bad) t.setAttribute('aria-invalid', 'true'); else t.removeAttribute('aria-invalid');
      const box = document.getElementById('year-error');
      if (box) { box.hidden = !msg; box.textContent = msg; }
    }
  } else if (t.matches('[data-text-miss]')) state.a.misses[Number(t.dataset.miss)][t.dataset.key] = t.value;
  else if (t.matches('[data-pr]') && t.type !== 'radio') {
    const st = whenTarget(t.dataset.prt);
    st[t.dataset.pr] = t.value;
    if (t.dataset.pr === 'text') st.edited = t.value !== st.base;
  }
  else if (t.matches('[data-uf]')) {
    state.univForm[t.dataset.uf] = t.value;
    /* 入力し直したら、赤い枠をはずす */
    if (state.univErrors[t.dataset.uf]) { state.univErrors[t.dataset.uf] = false; t.classList.remove('invalid'); t.removeAttribute('aria-invalid'); }
  }
  else if (t.matches('[data-te]')) state.targetEdit[t.dataset.te] = t.value;
  else if (t.matches('[data-ue]')) {
    if (state.univEdit) state.univEdit[t.dataset.ue] = t.value;
    if (state.univEditErrors && state.univEditErrors[t.dataset.ue]) { state.univEditErrors[t.dataset.ue] = false; t.classList.remove('invalid'); t.removeAttribute('aria-invalid'); }
  }
  else if (t.matches('[data-re]')) {
    if (t.dataset.re in DIGIT_MAX && !e.isComposing) {
      const v = cleanDigitValue(t.value, t.dataset.re);
      if (v !== t.value) t.value = v;
    }
    if (state.recEdit) state.recEdit[t.dataset.re] = t.value;
  }
});

state.step = isWelcomed() ? 'intro' : 'welcome';
try { history.replaceState({ step: state.step, univId: '' }, '', location.pathname + location.search); } catch (e) { /* noop */ }
render();
})();
</script>
