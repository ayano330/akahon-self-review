<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>赤本セルフチェック(生物)試作版 v3</title>
<style>
:root {
  --bg: #f6f8f7;
  --card: #ffffff;
  --fg: #1c2a24;
  --muted: #55645c;
  --border: #d5ddd8;
  --primary: #1f6b4a;
  --primary-fg: #ffffff;
  --primary-soft: #e6f3ec;
  --warn-bg: #fff4dc;
  --warn-fg: #7a4b00;
  --danger: #b3261e;
  --radius: 12px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  line-height: 1.7;
  font-size: 16px;
}
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 64px; }
h1 { font-size: 1.35rem; line-height: 1.4; margin: 0 0 8px; }
h2 { font-size: 1.1rem; margin: 0 0 8px; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
h1:focus { outline: none; }

.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row-between { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.card-accent { border-color: var(--primary); border-width: 2px; }
.muted { color: var(--muted); font-size: 0.9rem; }
.badge { display: inline-block; background: var(--warn-bg); color: var(--warn-fg); border-radius: 999px; padding: 2px 12px; font-size: 0.8rem; font-weight: 700; }
.notice { background: var(--primary-soft); border-radius: var(--radius); padding: 12px 16px; }
.notice-warn { background: var(--warn-bg); color: var(--warn-fg); }
.error { color: var(--danger); font-weight: 700; }
ul.plain { margin: 0; padding-left: 1.2em; }
ul.plain li { margin: 2px 0; }
ol.steps { margin: 0; padding-left: 1.4em; }
ol.steps li { margin: 4px 0; }

.progress { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--primary); }

fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 700; padding: 0; margin-bottom: 8px; }
.options { display: flex; flex-wrap: wrap; gap: 8px; }
.option { position: relative; }
.option input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.option span { display: block; padding: 10px 14px; min-height: 44px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--card); }
.option:has(input:checked) span { border-color: var(--primary); background: var(--primary-soft); font-weight: 700; }
.option:has(input:focus-visible) span { outline: 3px solid var(--primary); outline-offset: 2px; }
.options.col { flex-direction: column; }
.options.col .option span { width: 100%; }

input[type="number"], input[type="text"], input[type="date"], input[type="time"], textarea {
  width: 100%;
  font: inherit;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  color: var(--fg);
}
textarea { min-height: 120px; resize: vertical; }
textarea.short { min-height: 88px; }
label.field { display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
.inline-num { display: flex; align-items: center; gap: 8px; }
.inline-num input { max-width: 140px; }

.btn { font: inherit; font-weight: 700; min-height: 44px; padding: 8px 20px; border-radius: var(--radius); border: 2px solid var(--primary); background: var(--card); color: var(--primary); cursor: pointer; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-quiet { border-color: var(--border); color: var(--muted); font-weight: 400; }
.btn-danger { border-color: var(--danger); color: var(--danger); }
.btn-sm { min-height: 40px; padding: 4px 14px; font-size: 0.95rem; }

.bar-row { display: grid; grid-template-columns: 8.5em 1fr 2.5em; gap: 8px; align-items: center; font-size: 0.9rem; }
.bar { height: 12px; background: var(--border); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: #8fb7a2; }
.bar-row.top .bar > span { background: var(--primary); }
.score-big { font-size: 2rem; font-weight: 700; line-height: 1.2; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.95rem; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.goal { background: var(--primary-soft); border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; }
.chip { display: inline-block; background: var(--primary-soft); border-radius: 999px; padding: 2px 12px; font-size: 0.9rem; }
.chart svg { width: 100%; height: auto; display: block; }
table.data { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
table.data th, table.data td { border-bottom: 1px solid var(--border); padding: 4px 8px; text-align: left; }
.qa { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.qa-q { font-size: 1.15rem; font-weight: 700; }
.dots { letter-spacing: 2px; color: var(--primary); }

.univ-list { display: flex; flex-direction: column; gap: 8px; }
.univ-btn { font: inherit; text-align: left; width: 100%; min-height: 56px; padding: 12px 16px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--fg); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.univ-btn:hover { border-color: var(--primary); }
.univ-btn strong { font-size: 1.05rem; }
.univ-btn .sub { color: var(--muted); font-size: 0.9rem; text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.9rem; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.status { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: 0.85rem; font-weight: 700; background: var(--primary-soft); color: var(--primary); }
.status.warn { background: var(--warn-bg); color: var(--warn-fg); }
.status.gray { background: #e9ecea; color: var(--muted); }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
.stat b { font-size: 1.4rem; display: block; line-height: 1.3; }
.rec-item { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }

[hidden] { display: none !important; }
input.invalid { border-color: var(--danger); background: #fdecea; }
.icon-btn { font: inherit; width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--muted); cursor: pointer; padding: 0; }
.icon-btn:hover { border-color: var(--primary); color: var(--primary); }
.icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.icon-btn.small { width: 36px; height: 36px; border-width: 1px; border-radius: 8px; }
.icon-btn svg, .btn svg { width: 20px; height: 20px; flex: none; }
.icon-btn.small svg { width: 18px; height: 18px; }
.btn .ic { display: inline-flex; align-items: center; gap: 6px; }
.univ-row { display: flex; gap: 8px; align-items: stretch; }
.univ-row .univ-btn { flex: 1; min-width: 0; }
.fields-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.suggest .chip-btn { font: inherit; min-height: 40px; padding: 4px 14px; border: 2px solid var(--primary); border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 700; cursor: pointer; }
table.data td.num, table.data th.num { text-align: right; white-space: nowrap; }
table.data td.act { width: 44px; text-align: right; padding: 2px 4px; }
.sr-only { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* 約束カード: 罫線ノートの切れ端。ほかの画面と違う、手書きの雰囲気で目を引く */
.scrap-wrap {
  --hand: "Klee", "Klee One", "UD Digi Kyokasho N-R", "UD デジタル 教科書体 N-R", "HG教科書体", "Hiragino Maru Gothic ProN", "Yu Gothic UI", sans-serif;
  position: relative; margin: 14px 6px 10px; transform: rotate(-1.2deg);
  filter: drop-shadow(2px 4px 4px rgba(0, 0, 0, 0.22));
}
.scrap-wrap::before {
  content: ""; position: absolute; top: -11px; left: 50%; width: 88px; height: 22px; margin-left: -44px; z-index: 1;
  background: rgba(255, 213, 79, 0.7); transform: rotate(3deg);
}
.scrap {
  position: relative; padding: 0 16px 2rem 3.4rem; color: #232a4d;
  font-family: var(--hand); font-weight: 600; font-size: 1.05rem; line-height: 2rem;
  background-color: #fffbe8;
  background-image:
    linear-gradient(90deg, transparent 2.7rem, #e57373 2.7rem, #e57373 calc(2.7rem + 2px), transparent calc(2.7rem + 2px)),
    repeating-linear-gradient(180deg, transparent 0, transparent calc(2rem - 1px), #b3d1ea calc(2rem - 1px), #b3d1ea 2rem);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), 96% calc(100% - 1px), 92% calc(100% - 7px), 88% 100%, 84% calc(100% - 5px), 80% calc(100% - 1px), 76% calc(100% - 6px), 72% 100%, 68% calc(100% - 4px), 64% calc(100% - 7px), 60% calc(100% - 1px), 56% calc(100% - 5px), 52% 100%, 48% calc(100% - 6px), 44% calc(100% - 2px), 40% calc(100% - 7px), 36% 100%, 32% calc(100% - 4px), 28% calc(100% - 7px), 24% calc(100% - 1px), 20% calc(100% - 5px), 16% 100%, 12% calc(100% - 6px), 8% calc(100% - 2px), 4% calc(100% - 6px), 0 100%);
}
.scrap p { margin: 0; line-height: 2rem; overflow-wrap: anywhere; }
.scrap-head { display: flex; align-items: center; }
.scrap-head span { display: inline-block; line-height: 1.5rem; padding: 0 14px; font-size: 1.05rem; color: #c62828; border: 2px solid #c62828; border-radius: 52% 48% 55% 45% / 55% 45% 55% 45%; transform: rotate(-3deg); }
.scrap-when { font-size: 1.4rem; color: #c62828; text-decoration: underline wavy #c62828; text-underline-offset: 5px; text-decoration-thickness: 1.5px; transform: rotate(-0.6deg); }
.scrap-body { transform: rotate(0.3deg); }
.scrap-goal { font-size: 0.95rem; }
.scrap-goal mark { background: linear-gradient(transparent 55%, #fff176 55%); color: inherit; }
.stamp { position: absolute; right: 4px; bottom: -14px; width: 112px; height: 112px; transform: rotate(-14deg); mix-blend-mode: multiply; opacity: 0.9; pointer-events: none; }
.stamp svg, .fight svg { width: 100%; height: 100%; display: block; }
.stamp.pop { animation: stamp-in 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
@keyframes stamp-in {
  0% { transform: rotate(-32deg) scale(2.6); opacity: 0; }
  55% { opacity: 0.95; }
  100% { transform: rotate(-14deg) scale(1); opacity: 0.9; }
}
.fight { position: absolute; right: -4px; bottom: -6px; width: 168px; height: 92px; transform: rotate(-8deg); pointer-events: none; }
.fight text { font-family: var(--hand); }
.fight.pop { animation: fight-in 0.5s ease-out both; }
@keyframes fight-in {
  0% { transform: rotate(-7deg) scale(0.4); opacity: 0; }
  100% { transform: rotate(-7deg) scale(1); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) { .stamp.pop, .fight.pop { animation: none; } }

/* 下のタブバー(戻る / ホーム / 約束)。親指で押せる位置 */
.has-tabbar main { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.tabbar-in { max-width: 640px; margin: 0 auto; display: flex; }
.tab { font: inherit; position: relative; flex: 1; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: none; color: var(--muted); font-size: 0.75rem; font-weight: 700; cursor: pointer; padding: 6px 4px; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--primary); background: var(--primary-soft); }
.tab:disabled { opacity: 0.35; cursor: not-allowed; }
.tab-badge { position: absolute; top: 4px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--danger); color: #fff; font-size: 0.7rem; line-height: 18px; text-align: center; }

/* 約束ページの絞り込み */
.seg { display: flex; gap: 6px; }
.seg-btn { font: inherit; flex: 1; min-height: 44px; padding: 6px 4px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--fg); font-weight: 700; cursor: pointer; }
.seg-btn[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.seg-btn .seg-n { font-weight: 400; margin-left: 4px; }
</style>
</head>

/* =========================================================
 * 2. 判断ロジック(純粋関数)
 * ========================================================= */
const TAG_IDS = TAGS.map((t) => t.id);
const tagLabel = (id) => (TAGS.find((t) => t.id === id) || { label: id }).label;
const findForm = (id) => FORMS.find((f) => f.id === id);
const findReason = (formId, reasonId) => {
  const f = findForm(formId);
  return f ? f.reasons.find((r) => r.id === reasonId) : undefined;
};

function calcScores(a) {
  const scores = {};
  TAG_IDS.forEach((t) => { scores[t] = 0; });
  a.misses.forEach((m) => {
    const r = findReason(m.form, m.reason);
    if (r) scores[r.tag] += LOSS_WEIGHT[m.loss] || 0;
  });
  scores.timeshort += TIME_WEIGHT[a.time] || 0;
  return scores;
}

function decide(a) {
  const scores = calcScores(a);
  const ranked = TAG_IDS
    .filter((t) => scores[t] > 0)
    .sort((x, y) => (scores[y] - scores[x]) || (TAG_IDS.indexOf(x) - TAG_IDS.indexOf(y)));
  if (scores.unlearned > 0) {
    ranked.splice(ranked.indexOf('unlearned'), 1);
    ranked.unshift('unlearned');
  }
  return { scores, ranked, primary: ranked[0] || 'stable', secondary: ranked[1] || null };
}

const pct = (score, full) => Math.round((Number(score) / Number(full)) * 100);

/* 表記ゆれ対策: 全角半角・大文字小文字・空白をそろえる */
const nfkc = (s) => String(s || '').normalize('NFKC').replace(/\s+/g, '').toLowerCase();
/* 大学名: 「○○大学」「○○大」「○○」を同じとみなす */
const normUniv = (s) => {
  const k = nfkc(s).replace(/大学$/, '').replace(/大$/, '');
  return k || nfkc(s);
};
/* 日程名: 「T日程」「T」「Ｔ」「t」を同じとみなす */
const normSched = (s) => {
  const k = nfkc(s).replace(/日程$/, '');
  return k || nfkc(s);
};

/* 約束の内容(文章) */
function firstText(tag) {
  return ACTIONS[tag].first;
}
function promiseText(tag, scope, a) {
  const act = ACTIONS[tag];
  if (scope === 'first') return firstText(tag);
  if (scope === 'step1') return `${act.steps[0]}。目安は「${act.amount}」`;
  return `${act.title}:${act.steps.join(' → ')}。目安は「${act.amount}」`;
}
function defaultScope(a, prevProm) {
  if (prevProm && ['partial', 'held', 'released', 'replaced'].includes(prevProm.status)) return 'first';
  return a.study === '30' ? 'first' : (a.study === '60' ? 'step1' : 'all');
}

/* 日付・日時。when は '' (あとで決める) / 'YYYY-MM-DD' (日付だけ) / 'YYYY-MM-DDTHH:MM' */
const pad = (n) => String(n).padStart(2, '0');
const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toLocalIso = (d) => `${toDateStr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const todayStr = () => toDateStr(new Date());
const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
function parseDateStr(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
  if (!m) return null;
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return Number.isNaN(d.getTime()) ? null : d;
}
function fmtDate(s) {
  const d = parseDateStr(s);
  return d ? `${d.getMonth() + 1}/${d.getDate()}(${WEEK[d.getDay()]})` : '';
}
function fmtWhen(when) {
  if (!when) return 'あとで決める';
  if (when.length <= 10) return fmtDate(when);
  return `${fmtDate(when)} ${when.slice(11, 16)}`;
}
function isDue(p) {
  if (!p.when) return true;
  if (p.when.length <= 10) return p.when <= todayStr();
  return p.when <= toLocalIso(new Date());
}
function whenOptions() {
  const now = new Date();
  const at = (off) => toDateStr(new Date(now.getFullYear(), now.getMonth(), now.getDate() + off));
  const opt = (off, label) => ({ id: at(off), label: `${label} ${fmtDate(at(off))}` });
  const opts = [];
  if (now.getHours() < 20) opts.push(opt(0, '今日'));
  opts.push(opt(1, '明日'), opt(3, '3日後'), opt(7, '来週(7日後)'));
  opts.push({ id: 'custom', label: '自分で日付を決める' });
  opts.push({ id: 'later', label: 'あとで決める(日付なしで約束する)' });
  return opts;
}
/* 選んだ内容から when を作る。未選択・不正のときは null */
function composeWhen(st) {
  if (st.whenOpt === 'later') return '';
  const date = st.whenOpt === 'custom' ? st.date : st.whenOpt;
  if (!date || !parseDateStr(date)) return null;
  return st.time ? `${date}T${st.time}` : date;
}
function whenError(st) {
  if (!st.whenOpt) return 'いつやるか、選んでください。決められないときは「あとで決める」を選べます。';
  if (st.whenOpt === 'custom') {
    if (!st.date || !parseDateStr(st.date)) return '日付を入れてください。';
    if (st.date < todayStr()) return '今日以降の日付を選んでください。';
  }
  return '';
}

/* カレンダー(.ics)。日付だけなら終日の予定、時刻があれば15分の予定 */
const icsEscape = (s) => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const icsStamp = (iso) => iso.replace(/[-:]/g, '') + '00';
function buildIcs(p) {
  const uid = `akahon-${Date.now()}-${Math.random().toString(36).slice(2, 8)}@local`;
  const allDay = p.when.length <= 10;
  const when = [];
  if (allDay) {
    const start = parseDateStr(p.when);
    const next = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1);
    when.push(`DTSTART;VALUE=DATE:${p.when.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${toDateStr(next).replace(/-/g, '')}`);
  } else {
    const start = new Date(p.when);
    const end = new Date(start.getTime() + 15 * 60000);
    when.push(`DTSTART:${icsStamp(p.when)}`, `DTEND:${icsStamp(toLocalIso(end))}`);
  }
  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//akahon-self-review//JA', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${icsStamp(toLocalIso(new Date()))}`,
    ...when,
    `SUMMARY:${icsEscape('生物の約束: ' + (ACTIONS[p.tag] ? ACTIONS[p.tag].title : ''))}`,
    `DESCRIPTION:${icsEscape(p.text)}`,
    'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape('生物の約束の時間です')}`,
    allDay ? 'TRIGGER:PT9H' : 'TRIGGER:-PT5M',
    'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ];
  return lines.join('\r\n');
}

function readJson(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function writeJson(key, arr) {
  try { localStorage.setItem(key, JSON.stringify(arr)); return true; } catch (e) { return false; }
}
function clearKey(key) { try { localStorage.removeItem(key); } catch (e) { /* noop */ } }
const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const loadUnivs = () => readJson(KEY_UNIVS);
const saveUnivs = (arr) => writeJson(KEY_UNIVS, arr);
const loadRecs = () => readJson(KEY_RECORDS).sort((x, y) => x.ts - y.ts);
const saveRecs = (arr) => writeJson(KEY_RECORDS, arr);
const loadProms = () => readJson(KEY_PROMISES);
const saveProms = (arr) => writeJson(KEY_PROMISES, arr);

const isWelcomed = () => { try { return localStorage.getItem(KEY_WELCOME) === '1'; } catch (e) { return true; } };
const markWelcomed = () => { try { localStorage.setItem(KEY_WELCOME, '1'); } catch (e) { /* noop */ } };

/* 入試日程の名前を、この端末に覚えておく(次回から候補に出す)。表記ゆれ(T / T日程 / Ｔ)は同じとみなす */
function rememberSched(name) {
  const n = String(name || '').trim();
  if (!n) return;
  const list = readJson(KEY_SCHEDNAMES).filter((x) => typeof x === 'string');
  if (list.some((x) => normSched(x) === normSched(n))) return;
  list.unshift(n);
  writeJson(KEY_SCHEDNAMES, list.slice(0, MAX_SCHEDNAMES));
}
/* 日程名の候補。覚えてある名前と、登録済みの大学の日程名。入力中なら、近いものだけ */
function schedCandidates(typed) {
  const names = []; const seen = new Set();
  const add = (n) => {
    const k = normSched(n);
    if (typeof n === 'string' && n && !seen.has(k)) { seen.add(k); names.push(n); }
  };
  readJson(KEY_SCHEDNAMES).forEach(add);
  loadUnivs().forEach((u) => u.scheds.forEach((s) => add(s.name)));
  const q = normSched(typed);
  return q ? names.filter((n) => normSched(n).includes(q) && normSched(n) !== q) : names;
}

const getUniv = (id) => loadUnivs().find((u) => u.id === id);
function updateUniv(id, patch) {
  const arr = loadUnivs();
  const i = arr.findIndex((u) => u.id === id);
  if (i < 0) return false;
  arr[i] = Object.assign({}, arr[i], patch);
  return saveUnivs(arr);
}
function updateRec(id, patch) {
  const arr = loadRecs();
  const i = arr.findIndex((e) => e.id === id);
  if (i < 0) return false;
  arr[i] = Object.assign({}, arr[i], patch);
  return saveRecs(arr);
}
function updateProm(id, patch) {
  const arr = loadProms();
  const i = arr.findIndex((p) => p.id === id);
  if (i < 0) return null;
  arr[i] = Object.assign({}, arr[i], patch);
  saveProms(arr);
  return arr[i];
}

/* 日程を確定する。同じ名前(表記ゆれ込み)があればそれを使い、なければ追加する */
function matchSched(univ, name) {
  const key = normSched(name);
  return univ.scheds.find((s) => normSched(s.name) === key);
}
function resolveSched(univ, a) {
  const name = a.sched.trim();
  if (!name) return '';
  const hit = matchSched(univ, name);
  if (hit) return hit.id;
  const sched = { id: newId('s'), name };
  updateUniv(univ.id, { scheds: univ.scheds.concat([sched]) });
  return sched.id;
}

function makeEntry(a, d, univ, schedId) {
  return {
    id: newId('e'), ts: Date.now(), date: new Date().toLocaleDateString('ja-JP'),
    univId: univ.id, year: Number(a.year), schedId,
    round: a.round, score: Number(a.score), full: Number(a.full),
    primary: d.primary, secondary: d.secondary, scores: d.scores,
    promiseId: null
  };
}
function recLabel(r, univs) {
  const u = (univs || loadUnivs()).find((x) => x.id === r.univId);
  const s = u ? u.scheds.find((x) => x.id === r.schedId) : null;
  return `${u ? u.name : '(消した大学)'} ${r.year}年${s ? '・' + s.name : ''}`;
}
function latestPromiseOf(proms, recordId) {
  const list = proms.filter((p) => p.recordId === recordId).sort((x, y) => x.createdAt - y.createdAt);
  return list.length ? list[list.length - 1] : null;
}

function buildPrompt(a, d, includeMemo, prevProm) {
  const L = [];
  L.push('あなたは大学受験の生物を教える先生役です。');
  L.push('以下は、高校3年生の受験生が赤本(過去問)を解いたあとの自己分析の結果です。');
  L.push('');
  L.push('【診断結果(この優先順位は変えないでください)】');
  const roundLabel = (ROUNDS.find((r) => r.id === a.round) || {}).label || '';
  L.push(`- 赤本: ${roundLabel}、全${a.full}問中 ${a.score}問正解(${pct(a.score, a.full)}%)`);
  L.push(`- 最優先の課題: ${d.primary === 'stable' ? '(はっきりした課題なし)' : tagLabel(d.primary)}`);
  if (d.secondary) L.push(`- 次点の課題: ${tagLabel(d.secondary)}`);
  L.push(`- 時間配分: ${(TIMES.find((t) => t.id === a.time) || {}).label || ''}`);
  if (a.misses.length) {
    L.push('- 失点した設問:');
    a.misses.forEach((m, i) => {
      const f = findForm(m.form); const r = findReason(m.form, m.reason); const l = LOSS.find((x) => x.id === m.loss);
      L.push(`  ${i + 1}. 形式: ${f ? f.label : ''} / 原因: ${r ? r.label : ''} / 失点: ${l ? l.label : ''}`);
    });
  }
  L.push(`- 1日に生物に使える時間: ${(STUDY.find((s) => s.id === a.study) || {}).label || ''}`);
  if (prevProm && prevProm.status !== 'open') {
    const label = prevProm.status === 'done' ? 'やった'
      : (prevProm.status === 'partial' ? '一部だけやった' : 'できなかった');
    L.push(`- 前回の約束(${ACTIONS[prevProm.tag] ? ACTIONS[prevProm.tag].title : ''})の実行: ${label}`);
  }
  if (includeMemo && a.memo.trim()) L.push(`- 生徒のメモ: ${a.memo.trim()}`);
  L.push('');
  L.push('【お願い】');
  L.push('- 上の診断結果の優先順位を前提に、次の赤本までにやることを一緒に考えてください。');
  L.push('- 難しい言葉は避けて、短く、やさしく答えてください。一度に出す提案は1つまでにしてください。');
  L.push('- 最初に、私の理解度を確かめる質問を1〜2個してください。');
  L.push('- 個人情報(名前・学校名など)は聞かないでください。');
  L.push('- 不安や悩みの相談は、学校や塾の先生など身近な大人にも話すようすすめてください。');
  return L.join('\n');
}

function markerSvg(shape, cx, cy, color, hollow, r) {
  const rr = r || 5;
  const c = `fill="${hollow ? '#ffffff' : color}" stroke="${color}" stroke-width="2"`;
  if (shape === 'square') return `<rect x="${cx - rr}" y="${cy - rr}" width="${rr * 2}" height="${rr * 2}" ${c}/>`;
  if (shape === 'triangle') return `<polygon points="${cx},${cy - rr - 1} ${cx + rr + 1},${cy + rr} ${cx - rr - 1},${cy + rr}" ${c}/>`;
  if (shape === 'diamond') return `<polygon points="${cx},${cy - rr - 1} ${cx + rr + 1},${cy} ${cx},${cy + rr + 1} ${cx - rr - 1},${cy}" ${c}/>`;
  if (shape === 'hex') {
    const pts = [0, 1, 2, 3, 4, 5].map((k) => `${(cx + (rr + 1) * Math.cos((Math.PI / 3) * k)).toFixed(1)},${(cy + (rr + 1) * Math.sin((Math.PI / 3) * k)).toFixed(1)}`).join(' ');
    return `<polygon points="${pts}" ${c}/>`;
  }
  if (shape === 'cross') {
    const a = rr + 1; const b = 1.8;
    const pts = [[-b, -a], [b, -a], [b, -b], [a, -b], [a, b], [b, b], [b, a], [-b, a], [-b, b], [-a, b], [-a, -b], [-b, -b]]
      .map((p) => `${cx + p[0]},${cy + p[1]}`).join(' ');
    return `<polygon points="${pts}" ${c}/>`;
  }
  return `<circle cx="${cx}" cy="${cy}" r="${rr}" ${c}/>`;
}

/* 大学の記録から、日程ごとの系列を作る。同じ年度・日程は新しいほうを使う */
function buildSeries(univ, recs, draft) {
  const bySeries = new Map();
  const put = (key, year, v, isDraft) => {
    if (!bySeries.has(key)) bySeries.set(key, new Map());
    bySeries.get(key).set(year, { year, v, draft: isDraft });
  };
  recs.forEach((r) => put(r.schedId || '', r.year, pct(r.score, r.full), false));
  if (draft) put(draft.schedKey, draft.year, draft.v, true);
  const order = [];
  if (bySeries.has('')) order.push('');
  univ.scheds.forEach((s) => { if (bySeries.has(s.id)) order.push(s.id); });
  bySeries.forEach((_, k) => { if (!order.includes(k)) order.push(k); });
  const series = order.map((key) => {
    const idx = univ.scheds.findIndex((s) => s.id === key);
    let name; let styleIndex;
    if (key === '') {
      name = order.length > 1 ? '日程なし' : '';
      styleIndex = order.length > 1 ? 5 : 0;
    } else if (idx >= 0) {
      name = univ.scheds[idx].name; styleIndex = Math.min(idx, 4);
    } else {
      name = draft ? draft.schedName : ''; styleIndex = Math.min(univ.scheds.length, 4);
    }
    const points = [...bySeries.get(key).values()].sort((x, y) => x.year - y.year);
    return { key, name, style: SERIES_STYLES[styleIndex], points };
  });
  const years = [...new Set(series.flatMap((s) => s.points.map((p) => p.year)))].sort((x, y) => x - y);
  return { series, years };
}

function chartHtml(model, target) {
  const { series, years } = model;
  const W = 320, H = 210, L = 36, R = 14, T = 16, B = 36;
  const iw = W - L - R, ih = H - T - B;
  const x = (yr) => (years.length === 1 ? L + iw / 2 : L + (iw * years.indexOf(yr)) / (years.length - 1));
  const y = (v) => T + ih * (1 - Math.max(0, Math.min(100, v)) / 100);
  const grid = [0, 25, 50, 75, 100].map((v) => `<line x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}" stroke="#d5ddd8" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#55645c">${v}</text>`).join('');
  const tl = target != null
    ? `<line x1="${L}" y1="${y(target)}" x2="${W - R}" y2="${y(target)}" stroke="#b3261e" stroke-width="2" stroke-dasharray="6 4"/><text x="${W - R}" y="${y(target) - 5}" text-anchor="end" font-size="11" font-weight="700" fill="#b3261e">目標 ${target}%</text>`
    : '';
  const body = series.map((s, si) => {
    const line = s.points.length > 1
      ? `<polyline points="${s.points.map((p) => `${x(p.year)},${y(p.v)}`).join(' ')}" fill="none" stroke="${s.style.color}" stroke-width="2"/>`
      : '';
    const marks = s.points.map((p) => {
      const cx = x(p.year); const cy = y(p.v);
      const above = si % 2 === 0 && cy - 10 > T - 4;
      const ty = above ? cy - 10 : cy + 19;
      return `<g>${markerSvg(s.style.shape, cx, cy, s.style.color, p.draft)}<title>${esc((s.name ? s.name + ' ' : '') + p.year + '年: ' + p.v + '%')}</title></g><text x="${cx}" y="${ty}" text-anchor="middle" font-size="10" fill="${s.style.color}" font-weight="700">${p.v}%</text>`;
    }).join('');
    return line + marks;
  }).join('');
  const xl = years.map((yr) => `<text x="${x(yr)}" y="${H - B + 16}" text-anchor="middle" font-size="10" fill="#55645c">${yr}</text>`).join('');
  const desc = series.map((s) => (s.name ? s.name + ': ' : '') + s.points.map((p) => p.year + '年は' + p.v + '%').join('、')).join('。');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="正答率の推移。${esc(desc)}${target != null ? '。目標は' + target + '%' : ''}">${grid}${tl}${body}${xl}</svg>`;
}

function legendHtml(series) {
  if (series.length === 1 && !series[0].name) return '';
  return `<div class="legend" aria-label="日程の凡例">${series.map((s) => (
    `<span class="item"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">${markerSvg(s.style.shape, 8, 8, s.style.color, false, 4)}</svg>${esc(s.name || '正答率')}</span>`
  )).join('')}</div>`;
}

/* 解いた赤本の一覧(新しい年度が上)。同じ年度なら、新しく記録したものが上 */
function recordTableHtml(univ, recs, draft, deletable) {
  const rows = recs.map((r) => {
    const s = univ.scheds.find((x) => x.id === r.schedId);
    return { year: r.year, sched: s ? s.name : '', score: r.score, full: r.full, id: r.id, draft: false, ts: r.ts };
  });
  if (draft) rows.push({ year: draft.year, sched: draft.schedName, score: draft.score, full: draft.full, id: '', draft: true, ts: Infinity });
  rows.sort((x, y) => (y.year - x.year) || (y.ts - x.ts));
  const hasSched = rows.some((r) => r.sched);
  return `<table class="data">
    <thead><tr><th>年度</th>${hasSched ? '<th>入試日程</th>' : ''}<th class="num">正答/全問</th><th class="num">正答率</th>${deletable ? '<th><span class="sr-only" style="position:absolute;left:-9999px">削除</span></th>' : ''}</tr></thead>
    <tbody>${rows.map((r) => `<tr>
      <td>${r.year}年</td>${hasSched ? `<td>${esc(r.sched)}</td>` : ''}
      <td class="num">${r.score}/${r.full}</td>
      <td class="num"><strong>${pct(r.score, r.full)}%</strong>${r.draft ? '<br><span class="muted">(未保存)</span>' : ''}</td>
      ${deletable ? `<td class="act">${r.draft ? '' : `<button class="icon-btn small danger" data-action="remove-record" data-id="${esc(r.id)}" aria-label="${r.year}年${r.sched ? esc(r.sched) : ''}の記録を削除">${ICON_TRASH}</button>`}</td>` : ''}
    </tr>`).join('')}</tbody></table>`;
}

/* --- 約束ページ(未完了 / 完了 / もう少し で絞り込み) --- */
const PROM_GROUPS = [
  { id: 'todo', label: '未完了' },
  { id: 'done', label: '完了' },
  { id: 'partial', label: 'もう少し' }
];
/* 手放した・再約束した約束は、一覧に出さない(先生の画面には履歴として残る) */
const promGroup = (p) => (p.status === 'open' || p.status === 'held' ? 'todo' : (p.status === 'done' ? 'done' : (p.status === 'partial' ? 'partial' : '')));
const PROM_EMPTY = {
  todo: '未完了の約束はありません。',
  done: 'まだ完了した約束はありません。「やった」を記録すると、ここにスタンプが並びます。',
  partial: '「一部だけやった」約束が、ここに並びます。'
};
function renderPromises() {
  const univs = loadUnivs(); const recs = loadRecs(); const proms = loadProms();
  const groups = { todo: [], done: [], partial: [] };
  proms.forEach((p) => { const g = promGroup(p); if (g) groups[g].push(p); });
  /* 未完了は、確認待ち → 保留中の順。どれも新しい約束が上 */
  groups.todo.sort((x, y) => (x.status === y.status ? y.createdAt - x.createdAt : (x.status === 'open' ? -1 : 1)));
  groups.done.sort((x, y) => y.createdAt - x.createdAt);
  groups.partial.sort((x, y) => y.createdAt - x.createdAt);
  const f = groups[state.promFilter] ? state.promFilter : 'todo';
  const heldCount = groups.todo.filter((p) => p.status === 'held').length;
  return `
    <div class="stack">
      <h1 tabindex="-1">約束</h1>
      ${state.promMsg ? `<div class="notice" role="status">${esc(state.promMsg)}</div>` : ''}
      <div class="seg" role="group" aria-label="約束の絞り込み">
        ${PROM_GROUPS.map((g) => `<button class="seg-btn" data-action="prom-filter" data-id="${g.id}" aria-pressed="${f === g.id}">${g.label}<span class="seg-n">${groups[g.id].length}</span></button>`).join('')}
      </div>
      ${f === 'todo' && heldCount ? `
      <section class="card stack-sm">
        <p><strong>保留中の約束 ${heldCount}件</strong></p>
        <p class="muted">できなかった約束は、ここに残してあります。溜まっても大丈夫です。小さくして出し直したり、手放したりできます。</p>
        <div><button class="btn btn-sm" data-action="open-hold">保留中の約束を整える</button></div>
      </section>` : ''}
      ${groups[f].length === 0 ? `<p class="notice">${esc(PROM_EMPTY[f])}</p>` : ''}
      ${groups[f].map((p) => {
        if (p.status === 'open' && state.fuOpenId === p.id) return followupHtml(p, 1, 1, recs, univs);
        const rec = recs.find((r) => r.id === p.recordId);
        const reason = (FU_REASONS.find((x) => x.id === p.reason) || {}).label;
        return `
        <section class="stack-sm">
          <div class="row-between"><span class="muted">${esc(rec ? recLabel(rec, univs) : '')}</span>${statusChip(p.status)}</div>
          ${scrapHtml(p, { animate: p.id === state.stampedId })}
          ${(p.status === 'partial' || p.status === 'held') && reason ? `<p class="muted">理由: ${esc(reason)}</p>` : ''}
          ${p.status === 'open' ? `<div><button class="btn btn-sm" data-action="open-followup" data-id="${esc(p.id)}">どうだったか記録する</button></div>` : ''}
        </section>`;
      }).join('')}
    </div>`;
}

/* --- 大学の画面(赤本の軌跡) --- */
function trendSection(univ, recs, draft, title, deletable) {
  const model = buildSeries(univ, recs, draft);
  if (!model.years.length) {
    return `<section class="card stack-sm" aria-labelledby="tr"><h2 id="tr">${esc(title)}</h2><p class="muted">まだ記録がありません。「追加」から、解いた赤本を入れてください。</p></section>`;
  }
  return `
    <section class="card stack" aria-labelledby="tr">
      <h2 id="tr">${esc(title)}</h2>
      <div class="chart">${chartHtml(model, univ.target)}</div>
      ${legendHtml(model.series)}
      ${draft ? '<p class="muted">白抜きの印は、まだ保存していない今回の結果です。</p>' : ''}
      ${univ.target != null ? '' : '<p class="muted">目標の正答率を入れると、グラフに点線で出ます。</p>'}
      ${recordTableHtml(univ, recs, draft, !!deletable)}
    </section>`;
}

function draftInfo() {
  const univ = getUniv(state.univId);
  const a = state.a;
  const name = a.sched.trim();
  let schedKey = ''; let schedName = '';
  if (name) {
    const hit = matchSched(univ, name);
    schedKey = hit ? hit.id : '__draft';
    schedName = hit ? hit.name : name;
  }
  return { year: Number(a.year), schedKey, schedName, v: pct(a.score, a.full), score: Number(a.score), full: Number(a.full) };
}

function trendHtml() {
  const univ = getUniv(state.univId);
  if (!univ) return '';
  const recs = loadRecs().filter((r) => r.univId === univ.id);
  /* 通常は保存済みなので、記録がそのままグラフに出る。保存できなかったときだけ、白抜きの印で出す */
  const draft = state.savedId ? null : draftInfo();
  const cur = state.savedId ? recs.find((r) => r.id === state.savedId) : null;
  const me = draft ? { year: draft.year, schedKey: draft.schedKey } : (cur ? { year: cur.year, schedKey: cur.schedId || '' } : null);
  const dup = me && recs.some((r) => r.id !== state.savedId && r.year === me.year && (r.schedId || '') === me.schedKey);
  return trendSection(univ, recs, draft, `${univ.name} の正答率の推移`, false)
    + (dup ? '<p class="muted">同じ年度・日程の記録がすでにあります。グラフには、新しいほうの点だけを表示します。</p>' : '');
}

function compareHtml(res, d, a) {
  const prev = res.prev;
  if (!prev) return '';
  const pr = pct(prev.score, prev.full);
  const cr = pct(a.score, a.full);
  const diff = cr - pr;
  const diffText = diff > 0 ? `+${diff}` : String(diff);
  const same = prev.primary === d.primary;
  const prevLabel = prev.primary === 'stable' ? '課題なし' : tagLabel(prev.primary);
  const pp = res.prevProm;
  let fu = '';
  if (pp) {
    if (pp.status === 'open') fu = '<p>前回の約束: まだ「どうだったか」を記録していません。トップ画面で記録できます。</p>';
    else if (pp.status === 'done') fu = `<p>前回の約束: やりきりました。${diff > 0 ? 'やったことが、正答率に出ています。' : '今回は得点が動きませんでしたが、赤本ごとの難しさの差もあります。続けて確かめましょう。'}</p>`;
    else fu = `<p>前回の約束: ${esc(pp.status === 'partial' ? '一部だけやった' : 'できなかった')}。うまくいかなかった理由を、先生に話してみましょう。</p>`;
  }
  return `
    <section class="card stack-sm" aria-labelledby="cmp">
      <h2 id="cmp">前回との比べ方</h2>
      <p class="muted">${res.prevSame ? '同じ大学の前回と比べています。' : '前回(別の大学)と比べています。'}</p>
      <p>正答率: 前回 ${pr}%(${esc(prev.date)})→ 今回 ${cr}%(${diffText}ポイント)</p>
      ${same
        ? `<p>前回と同じ「${esc(prevLabel)}」が、今回も最優先です。前回のアクションは続けられましたか?続かなかったなら、時間を半分にして「最初の一歩」だけからやり直せば十分です。</p>`
        : `<p>前回の最優先だった「${esc(prevLabel)}」は、今回は最優先ではなくなりました。課題が入れ替わるのは、前に進んでいる証拠です。</p>`}
      ${fu}
    </section>`;
}

function renderResult() {

  return `
    <div class="stack">
      <h1 tabindex="-1">結果</h1>

      ${state.saveFailed

        : '<p class="muted">この赤本の記録は、この端末に自動で保存しました。消したいときは、大学のページの一覧から消せます。</p>'}

      </section>

      <section class="card" aria-labelledby="top">
        <h2 id="top" style="margin-bottom:12px">次の赤本までにやること</h2>
        ${actionHtml(d.primary, a, { onlyFirst })}
      </section>

      ${promiseHtml(d, a)}

      ${showSecondary ? `
      <section class="card stack-sm" aria-labelledby="second">

        <p><strong>${esc(tagLabel(d.secondary))}</strong>: ${esc(ACTIONS[d.secondary].short)}</p>
      </section>` : ''}

      ${trendHtml()}
      ${compareHtml(state.result, d, a)}

      <section class="card stack-sm" aria-labelledby="ai">
        <h2 id="ai">AIに相談してみる(任意)</h2>
        <p class="muted">ChatGPTやGeminiなどのAIを、すでに使っている人向けです。使わなくても、ここまでの結果で十分です。</p>
        <div><button class="btn" data-action="toggle-ai" aria-expanded="${state.showAi}">${state.showAi ? '閉じる' : 'AIに渡す文章を見る'}</button></div>
        ${state.showAi ? `
        <div class="notice notice-warn stack-sm">
          <p><strong>使う前に確認してください</strong></p>
          <ul class="plain">
            <li>このツールから、AIには何も送られません。下の文章を、自分でコピーして貼ります。</li>
            <li>AIのアカウントがある人だけ。年齢や保護者の了解は、各サービスのルールに従ってください。</li>
            <li>塾がすすめているものではありません。名前や学校名は、貼らないでください。</li>
            <li>AIの答えは、間違うことがあります。迷ったら先生に聞いてください。</li>
          </ul>
        </div>
        ${hasMemo ? `<label class="row"><input type="checkbox" id="include-memo" ${state.includeMemo ? 'checked' : ''}> <span>「ひとこと」の内容も、AIに渡す文章に入れる</span></label>` : ''}
        <label class="field">
          <span>AIに渡す文章(中身を読んでから使ってください)</span>
          <textarea id="prompt-text" readonly style="min-height:260px">${esc(prompt)}</textarea>

/* --- 保留ゾーン --- */

  const univs = loadUnivs();

  return `

      ${state.holdMsg ? `<div class="notice" role="status">${esc(state.holdMsg)}</div>` : ''}
      ${held.length === 0 ? '<p class="notice">保留中の約束はありません。</p>' : ''}
      ${held.map((p) => {
        const rec = recs.find((r) => r.id === p.recordId);
        const reason = (FU_REASONS.find((r) => r.id === p.reason) || {}).label;
        const canShrink = p.scope !== 'first';
        return `
        <section class="card stack">
          <dl class="kv">

            <dt>やること</dt><dd>${esc(p.text)}</dd>
            ${reason ? `<dt>理由</dt><dd>${esc(reason)}</dd>` : ''}
          </dl>
          ${rp && rp.id === p.id ? `
          <div class="stack">
            <p class="notice">${canShrink ? 'いちばん小さい形(2分でできる「最初の一歩」)にしました。' : '日付を決め直して、もう一度約束しましょう。'}</p>
            ${textFieldHtml(rp, 'repromise')}
            ${whenFieldsHtml(rp, 'repromise')}
            ${errorHtml(state.repromiseError)}

/* --- 先生に見せる画面(読むだけ) --- */
function renderTeacher() {

          return `<p>${esc(u.name)} <span class="muted">目標 ${u.target != null ? u.target + '%' : '未設定'}・記録${n}件${u.scheds.length ? '・日程: ' + esc(u.scheds.map((s) => s.name).join('、')) : ''}</span></p>`;
        }).join('') : '<p class="muted">まだありません。</p>'}
      </section>
      <section class="stack-sm" aria-labelledby="t-rec">

        ${[...recs].reverse().map((r) => {
          const ps = proms.filter((p) => p.recordId === r.id).sort((x, y) => x.createdAt - y.createdAt);
          return `
          <div class="rec-item stack-sm">
            <p><strong>${esc(recLabel(r, univs))}</strong> <span class="muted">${esc(r.date)}</span></p>
            <p>正答率 <strong>${pct(r.score, r.full)}%</strong>(全${esc(r.full)}問中 ${esc(r.score)}問正解)・最優先の課題: ${esc(r.primary === 'stable' ? '課題なし' : tagLabel(r.primary))}</p>
            ${ps.length ? ps.map((p) => `
              <p>約束: ${esc(p.text)}<br><span class="muted">${esc(fmtWhen(p.when))}</span> ${statusChip(p.status)}${p.reason ? ` <span class="muted">(理由: ${esc((FU_REASONS.find((x) => x.id === p.reason) || {}).label || '')})</span>` : ''}</p>`).join('') : '<p class="muted">約束: なし</p>'}
          </div>`;
        }).join('')}

}

const VIEWS = {
  welcome: renderWelcome, about: renderAbout, intro: renderIntro, addUniv: renderAddUniv, univ: renderUniv,
  basic: renderBasic, time: renderTime,
  misses: renderMisses, study: renderStudy, memo: renderMemo, result: renderResult,
  hold: renderHold, teacher: renderTeacher, promises: renderPromises
};

/* --- 下のタブバー(戻る / ホーム / 約束)。入力中の画面と最初の案内では隠す --- */
const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
const ICON_HOME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>';
const ICON_NOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>';
const NAV_HIDDEN_STEPS = ['welcome'].concat(STEPS);
/* 「戻る」の行き先。結果は大学のページへ、保留中の約束は来た場所へ、それ以外はホームへ */
function parentStep() {
  if (state.step === 'result') return 'univ';
  if (state.step === 'hold') return state.holdFrom || 'intro';
  return 'intro';
}
/* 約束ページを開く。goto と違い、スタンプ演出用の stampedId を残せる */
function showPromises(opts) {
  opts = opts || {};
  state.step = 'promises';
  state.error = '';
  state.repromise = null;
  state.holdMsg = '';
  state.fuOpenId = '';
  if (opts.filter) state.promFilter = opts.filter;
  state.promMsg = opts.msg || '';
  state.stampedId = opts.stampedId || '';
  try { history.pushState({ step: 'promises', univId: state.univId }, '', '#promises'); } catch (e) { /* noop */ }

}
function renderTabbar() {
  const bar = document.getElementById('tabbar');
  if (!bar) return;
  const hidden = NAV_HIDDEN_STEPS.includes(state.step);
  document.body.classList.toggle('has-tabbar', !hidden);
  bar.hidden = hidden;
  if (hidden) { bar.innerHTML = ''; return; }
  const n = loadProms().filter((p) => p.status === 'open' || p.status === 'held').length;
  const cur = state.step;
  const onProm = cur === 'promises' || cur === 'hold';
  bar.innerHTML = `<div class="tabbar-in">
    <button class="tab" data-action="nav-back" ${cur === 'intro' ? 'disabled' : ''}>${ICON_BACK}<span>戻る</span></button>
    <button class="tab${cur === 'intro' ? ' on' : ''}" data-action="home" ${cur === 'intro' ? 'aria-current="page"' : ''}>${ICON_HOME}<span>ホーム</span></button>
    <button class="tab${onProm ? ' on' : ''}" data-action="open-promises" ${onProm ? 'aria-current="page"' : ''} aria-label="約束${n ? '(未完了' + n + '件)' : ''}">${ICON_NOTE}<span>約束</span>${n ? `<b class="tab-badge" aria-hidden="true">${n > 9 ? '9+' : n}</b>` : ''}</button>
  </div>`;
}

function render(opts) {
  if (!VIEWS[state.step]) state.step = 'intro';
  app.innerHTML = VIEWS[state.step]();
  renderTabbar();
  if (opts && opts.focusSelector) {
    const el = app.querySelector(opts.focusSelector);
    if (el) el.focus();
  } else if (opts && opts.focusTop) {
    const h = app.querySelector('h1');
    if (h) h.focus();
    window.scrollTo(0, 0);
  }
}
/* 画面を切り替える。ブラウザの「戻る」でも前の画面にもどれるように、履歴に積む */
function goto(step) {
  state.step = step;
  state.error = '';
  state.stampedId = ''; state.promMsg = ''; state.fuOpenId = '';
  try { history.pushState({ step, univId: state.univId }, '', '#' + step); } catch (e) { /* noop */ }
  render({ focusTop: true });
}
function guardStep(step) {
  if (!isWelcomed()) return 'welcome';
  if (step === 'welcome') return 'intro';
  if (STEPS.includes(step) && !state.started) return 'intro';
  if (step === 'result' && !state.result) return 'intro';
  if (step === 'univ' && !getUniv(state.univId)) return 'intro';
  return VIEWS[step] ? step : 'intro';
}
window.addEventListener('popstate', (e) => {
  const s = e.state;
  if (s && s.univId) state.univId = s.univId;
  state.step = guardStep(s && s.step ? s.step : 'intro');
  render({ focusTop: true });
});
const radioSel = (t) => `input[name="${t.name}"][value="${t.value}"]`;

/* =========================================================
 * 7. 入力チェック
 * ========================================================= */
function validate(step) {
  const a = state.a;
  if (step === 'basic') {
    const univ = getUniv(state.univId);
    if (a.year === '') return '解いた年度を入れてください。';
    const y = Number(a.year);
    if (!(/^\d{4}$/.test(a.year) && y >= 2000 && y <= 2100)) return '年度は、西暦4桁の数字で入力してください。(例: 2025)';
    const name = a.sched.trim();
    if (name && !matchSched(univ, name) && univ.scheds.length >= MAX_SCHEDS) {
      return `この大学の入試日程は${MAX_SCHEDS}つまでです。すでにある日程の名前を使ってください。`;
    }
    if (a.full === '') return '全問題数を入力してください。';
    if (a.score === '') return '正答数を入力してください。';
    const s = Number(a.score);
    const f = Number(a.full);
    if (!(f >= 1)) return '全問題数は、1以上の数字を入力してください。';
    if (!(s >= 0) || s > f) return '正答数は、0以上で全問題数以下の数字を入力してください。';
  }
  if (step === 'time' && !a.time) return '当てはまるものを選んでください。';
  if (step === 'misses') {
    for (let i = 0; i < a.misses.length; i++) {
      const m = a.misses[i];
      if (!m.form) return `設問${i + 1}: どんな問題だったか選んでください。`;
      if (!m.reason) return `設問${i + 1}: 理由を選んでください。`;
      if (!m.loss) return `設問${i + 1}: どのくらい落としたか選んでください。`;
    }
  }
  if (step === 'study' && !a.study) return '使える時間を選んでください。';
  return '';
}

/* =========================================================
 * 8. イベント
 * ========================================================= */
async function copyText(text, fallbackId) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = fallbackId ? document.getElementById(fallbackId) : null;
    if (!ta) return false;
    ta.focus(); ta.select();
    try { return document.execCommand('copy'); } catch (e2) { return false; }
  }
}
function downloadText(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function promiseCopyText(p) {
  const act = ACTIONS[p.tag];
  return `【生物の約束】\n日時: ${fmtWhen(p.when)}\nやること: ${p.text}\n終わりの目印: ${act ? act.goal : ''}`;
}
function setStatus(id, msg) {
  const el = document.getElementById(id);
  if (el) el.textContent = msg;
}
function makePromise(recordId, tag, scope, text, first, when, parentId) {
  return {
    id: newId('p'), recordId, tag, scope, text, first, when,
    createdAt: Date.now(), status: 'open', reason: '', answeredAt: null, parentId: parentId || ''
  };
}
/* 今回の記録を保存して返す。結果が出たときに自動で呼ぶ。
 * 結果画面から入力にもどって出し直したときは、新しく増やさず、同じ記録を上書きする */
function ensureRecord() {
  const univ = getUniv(state.univId);
  const schedId = resolveSched(univ, state.a);
  const entry = makeEntry(state.a, state.result.d, univ, schedId);
  const all = loadRecs();
  const i = state.savedId ? all.findIndex((r) => r.id === state.savedId) : -1;
  if (i >= 0) { entry.id = all[i].id; entry.ts = all[i].ts; entry.date = all[i].date; all[i] = entry; } else all.push(entry);
  if (!saveRecs(all)) return null;
  state.savedId = entry.id; state.saved = true;
  return entry;
}
const currentRecord = () => (state.savedId ? loadRecs().find((r) => r.id === state.savedId) || null : null);
function startFlow() {
  state.a = newAnswers();
  state.a.misses.push(newMiss());
  state.started = true;
  state.saved = false; state.savedId = ''; state.savedPromise = null;
  state.showAi = false; state.includeMemo = false; state.followupMsg = '';
  goto(STEPS[0]);
}
function showResult() {
  const a = state.a;
  const univ = getUniv(state.univId);
  /* 今回の記録(出し直しのときは前回の分)は、比べる相手に入れない */
  const all = loadRecs().filter((r) => r.id !== state.savedId);
  const mine = all.filter((r) => r.univId === univ.id);
  const prev = mine.length ? mine[mine.length - 1] : (all.length ? all[all.length - 1] : null);
  const proms = loadProms();
  const prevProm = prev ? latestPromiseOf(proms, prev.id) : null;
  /* 何回目かは、この端末の記録の数から自動で数える(3回目以降は「3」) */
  a.round = String(Math.min(3, all.length + 1));
  const d = decide(a);
  state.result = { d, prev, prevSame: mine.length > 0, prevProm };
  /* 出し直しのとき、前の結果につくった約束は消す(結果が変わるため) */
  if (state.savedPromise) saveProms(loadProms().filter((p) => p.id !== state.savedPromise.id));
  state.savedPromise = null; state.promiseError = '';
  state.saveFailed = !ensureRecord();
  const scope = defaultScope(a, prevProm);
  const text = promiseText(d.primary, scope, a);
  state.promise = newWhenState({ scope, text, base: text });
  goto('result');
}
/* 「いつ」「やること」の入力先(state.promise か state.repromise) */
const whenTarget = (name) => (name === 'repromise' ? state.repromise : state.promise);
function removeUnivData(univId) {
  const recs = loadRecs();
  const recIds = recs.filter((r) => r.univId === univId).map((r) => r.id);
  saveRecs(recs.filter((r) => r.univId !== univId));
  saveProms(loadProms().filter((p) => !recIds.includes(p.recordId)));
  saveUnivs(loadUnivs().filter((u) => u.id !== univId));
}

/* 目標の正答率: 必ず入れる。1〜100の整数。不正・未入力のときは undefined */
function parseTarget(v) {
  if (v === '') return undefined;
  const t = Number(v);
  return (Number.isInteger(t) && t >= 1 && t <= 100) ? t : undefined;
}
const TARGET_ERROR = '目標の正答率を、1〜100の整数で入力してください。';

/* 入試日程の入力欄の下に、覚えてある日程名の候補を出す */
function updateSchedSuggest() {
  const input = app.querySelector('[data-text="sched"]');
  const box = document.getElementById('sched-suggest');
  if (!input || !box) return;
  const list = schedCandidates(input.value);
  box.innerHTML = list.length
    ? '<span class="muted">タップして選べます:</span>' + list.map((n) => `<button type="button" class="chip-btn" data-action="pick-sched" data-name="${esc(n)}">${esc(n)}</button>`).join('')
    : '';
  box.hidden = !list.length;
}
function hideSchedSuggest() {
  const box = document.getElementById('sched-suggest');
  if (box) box.hidden = true;
}

const onClick = async (e) => {
  if (!e.target.closest('.sched-field')) hideSchedSuggest();
  const btn = e.target.closest('[data-action]');
  if (!btn || btn.disabled) return;
  const act = btn.dataset.action;

  if (act === 'welcome-ok') {
    markWelcomed();
    state.step = 'intro';
    try { history.replaceState({ step: 'intro', univId: '' }, '', location.pathname + location.search); } catch (err) { /* noop */ }
    render({ focusTop: true });
  } else if (act === 'pick-sched') {
    const input = app.querySelector('[data-text="sched"]');
    if (input) { input.value = btn.dataset.name; state.a.sched = btn.dataset.name; input.focus(); }
    hideSchedSuggest();
  } else if (act === 'home') {
    if (state.step === 'intro') return;
    state.targetEdit = null; state.repromise = null; state.holdMsg = '';
    goto('intro');
  } else if (act === 'open-add-univ') {
    state.univForm = { name: UNIV_SUFFIX, target: '' }; state.univError = ''; state.univErrors = {};
    goto('addUniv');
    const el = app.querySelector('[data-uf="name"]');
    if (el) { el.focus(); el.setSelectionRange(0, 0); }
  } else if (act === 'delete-univ') {
    if (window.confirm('この大学に関するすべての記録を削除します。よろしいですか?')) {
      removeUnivData(btn.dataset.id);
      if (state.univId === btn.dataset.id) state.univId = '';
      render();
    }
  } else if (act === 'add-univ') {
    /* 「大学」が重なったら1つにする(例: 東京大学+大学)。「大学」だけ(校名なし)は未入力扱い */
    const name = state.univForm.name.trim().replace(/(大学)+$/, UNIV_SUFFIX);
    const univs = loadUnivs();
    const errs = {}; const msgs = [];
    if (!name.replace(/大学$/, '').trim()) { errs.name = true; msgs.push('大学名を入れてください。'); }
    const target = parseTarget(state.univForm.target);
    if (target === undefined) { errs.target = true; msgs.push(TARGET_ERROR); }
    if (!msgs.length && univs.length >= MAX_UNIVS) msgs.push(`大学は${MAX_UNIVS}校までです。`);
    const dup = !msgs.length ? univs.find((u) => normUniv(u.name) === normUniv(name)) : null;
    if (dup) { errs.name = true; msgs.push(`「${dup.name}」は、すでに登録されています。一覧からその大学を開いてください。`); }
    if (msgs.length) {
      state.univErrors = errs; state.univError = msgs.join(' ');
      render({ focusSelector: errs.name ? '[data-uf="name"]' : (errs.target ? '[data-uf="target"]' : null) });
      return;
    }
    state.univErrors = {};
    const u = { id: newId('u'), name, target, scheds: [] };
    univs.push(u);
    if (!saveUnivs(univs)) { state.univError = '保存できませんでした(ブラウザの設定で保存が禁止されているかもしれません)。'; render(); return; }
    state.univId = u.id; state.targetEdit = null;
    goto('univ');
  } else if (act === 'open-univ') {
    state.univId = btn.dataset.id; state.targetEdit = null; state.targetError = '';
    goto('univ');
  } else if (act === 'to-univ') {
    state.targetEdit = null;
    goto('univ');
  } else if (act === 'edit-target') {
    const u = getUniv(state.univId);
    state.targetEdit = { value: u && u.target != null ? String(u.target) : '' }; state.targetError = '';
    render({ focusSelector: '[data-te="value"]' });
  } else if (act === 'cancel-target') {
    state.targetEdit = null; state.targetError = '';
    render();
  } else if (act === 'save-target') {
    const target = parseTarget(state.targetEdit.value);
    if (target === undefined) { state.targetError = TARGET_ERROR; render(); return; }
    updateUniv(state.univId, { target });
    state.targetEdit = null; state.targetError = '';
    render();
  } else if (act === 'remove-record') {
    if (window.confirm('この記録と、その約束を消します。よろしいですか?')) {
      const id = btn.dataset.id;
      saveRecs(loadRecs().filter((r) => r.id !== id));
      saveProms(loadProms().filter((p) => p.recordId !== id));
      render();
    }
  } else if (act === 'start') {
    startFlow();
  } else if (act === 'back') {
    const i = STEPS.indexOf(state.step);
    goto(i <= 0 ? 'univ' : STEPS[i - 1]);
  } else if (act === 'next') {
    const err = validate(state.step);
    if (err) {
      state.error = err;
      render();
      const el = app.querySelector('.error');
      if (el) el.scrollIntoView({ block: 'center' });
      return;
    }
    if (state.step === 'basic') rememberSched(state.a.sched);
    const i = STEPS.indexOf(state.step);
    if (i === STEPS.length - 1) showResult();
    else goto(STEPS[i + 1]);
  } else if (act === 'add-miss') {
    if (state.a.misses.length < 3) {
      state.a.misses.push(newMiss());
      state.error = '';
      render({ focusSelector: `[data-miss="${state.a.misses.length - 1}"]` });
    }
  } else if (act === 'remove-miss') {
    state.a.misses.splice(Number(btn.dataset.index), 1);
    state.error = '';
    render();
  } else if (act === 'reset-text') {
    const st = whenTarget(btn.dataset.prt);
    st.text = st.base; st.edited = false;
    render();
  } else if (act === 'promise') {
    const st = state.promise;
    const err = whenError(st);
    const text = st.text.trim();
    if (err) { state.promiseError = err; render(); return; }
    if (!text) { state.promiseError = 'やることを入れてください。'; render(); return; }
    const rec = currentRecord();
    if (!rec) { state.promiseError = '保存できませんでした(ブラウザの設定で保存が禁止されているかもしれません)。'; render(); return; }
    const tag = state.result.d.primary;
    const p = makePromise(rec.id, tag, st.scope, text, firstText(tag), composeWhen(st) || '');
    const proms = loadProms();
    proms.push(p);
    if (!saveProms(proms)) { state.promiseError = '保存できませんでした(ブラウザの設定で保存が禁止されているかもしれません)。'; render(); return; }
    updateRec(rec.id, { promiseId: p.id });
    state.promiseError = '';
    state.savedPromise = p;
    render({ focusTop: false });
    const el = document.getElementById('pc'); if (el) el.scrollIntoView({ block: 'start' });
  } else if (act === 'ics') {
    downloadText('seibutsu-yakusoku.ics', buildIcs(state.savedPromise), 'text/calendar;charset=utf-8');
    setStatus('promise-status', 'カレンダー用のファイルを保存しました。開くと、カレンダーに入ります。開けないときは、「文章をコピー」を使ってください。');
  } else if (act === 'ics-prom') {
    const p = loadProms().find((x) => x.id === btn.dataset.id);
    if (p && p.when) {
      downloadText('seibutsu-yakusoku.ics', buildIcs(p), 'text/calendar;charset=utf-8');
      setStatus('up-status', 'カレンダー用のファイルを保存しました。開くと、カレンダーに入ります。');
    }
  } else if (act === 'copy-promise') {
    const ok = await copyText(promiseCopyText(state.savedPromise), null);
    setStatus('promise-status', ok ? 'コピーしました。メモやメッセージに貼って残せます。' : 'コピーできませんでした。画面のスクリーンショットを使ってください。');
  } else if (act === 'clear') {
    if (window.confirm('この端末に保存した、大学・記録・約束を、全部消します。よろしいですか?')) {
      /* 共有端末で次の人が使えるように、最初の案内画面も出し直す */
      [KEY_UNIVS, KEY_RECORDS, KEY_PROMISES, KEY_SCHEDNAMES, KEY_WELCOME, KEY_OLD, KEY_CARDS].forEach(clearKey);
      state.univId = ''; state.result = null; state.started = false;
      state.saved = false; state.savedId = ''; state.savedPromise = null; state.followupMsg = '';
      goto('welcome');
    }
  } else if (act === 'toggle-ai') {
    state.showAi = !state.showAi;
    render();
  } else if (act === 'copy') {
    const ok = await copyText(document.getElementById('prompt-text').value, 'prompt-text');
    setStatus('copy-status', ok ? 'コピーしました。AIの入力欄に貼ってください。' : 'コピーできませんでした。文章を選んで、手動でコピーしてください。');
  } else if (act === 'record-followup') {
    const f = state.followup;
    if (!f.status) { state.followupError = 'どうだったか、選んでください。'; render(); return; }
    if ((f.status === 'partial' || f.status === 'none') && !f.reason) { state.followupError = '理由を選んでください。'; render(); return; }
    updateProm(btn.dataset.id, {
      status: f.status === 'none' ? 'held' : f.status,
      reason: f.reason || '',
      answeredAt: Date.now()
    });
    const msg = (f.status === 'done'
      ? 'やりきりました。それがいちばん大事です。次の赤本で、効果を確かめましょう。'
      : (f.status === 'partial' ? 'できた分だけで十分です。次は「最初の一歩」だけの約束にして、確実に続けましょう。' : '保留の約束として残しました。いつでも、小さくして出し直せます。') + ' ' + (FU_REASON_MSG[f.reason] || '')).trim();
    state.followup = { status: '', reason: '' };
    state.followupError = '';
    state.followupMsg = '';
    /* 記録した約束が見える絞り込みへ。やった／もう少しは、印の演出をつける */
    showPromises({
      filter: f.status === 'none' ? 'todo' : f.status,
      msg,
      stampedId: (f.status === 'done' || f.status === 'partial') ? btn.dataset.id : ''
    });
  } else if (act === 'set-date') {
    const input = app.querySelector(`[data-setdate="${btn.dataset.id}"]`);
    const v = input ? input.value : '';
    if (!v || !parseDateStr(v)) { state.setDateError = '日付を選んでください。'; render(); return; }
    if (v < todayStr()) { state.setDateError = '今日以降の日付を選んでください。'; render(); return; }
    const p = updateProm(btn.dataset.id, { when: v });
    if (state.savedPromise && p && state.savedPromise.id === p.id) state.savedPromise = p;
    state.setDateError = '';
    state.followupMsg = `日付を ${fmtDate(v)} にしました。その日にまた聞きます。`;
    render({ focusTop: true });
  } else if (act === 'open-hold') {
    state.holdFrom = state.step === 'promises' ? 'promises' : 'intro';
    state.repromise = null; state.repromiseError = ''; state.holdMsg = '';
    goto('hold');
  } else if (act === 'nav-back') {
    if (state.step === 'intro') return;
    state.targetEdit = null; state.repromise = null; state.holdMsg = '';
    goto(guardStep(parentStep()));
  } else if (act === 'open-promises') {
    if (state.step === 'promises') return;
    showPromises({ filter: state.promFilter || 'todo' });
  } else if (act === 'prom-filter') {
    state.promFilter = btn.dataset.id; state.fuOpenId = ''; state.promMsg = ''; state.stampedId = '';
    render();
  } else if (act === 'open-followup') {
    state.fuOpenId = btn.dataset.id; state.followup = { status: '', reason: '' };
    state.followupError = ''; state.setDateError = ''; state.promMsg = '';
    render();
    const el = app.querySelector('#fu'); if (el) el.scrollIntoView({ block: 'start' });
  } else if (act === 'close-followup') {
    state.fuOpenId = ''; state.followupError = '';
    render();
  } else if (act === 'open-repromise') {
    const p = loadProms().find((x) => x.id === btn.dataset.id);
    if (!p) return;
    const text = (p.first || ACTIONS[p.tag].first).replace('{field}', 'まだ習っていない分野');
    state.repromise = newWhenState({ id: p.id, text, base: text });
    state.repromiseError = '';
    render();
  } else if (act === 'cancel-repromise') {
    state.repromise = null; state.repromiseError = '';
    render();
  } else if (act === 'confirm-repromise') {
    const st = state.repromise;
    const old = loadProms().find((x) => x.id === st.id);
    const err = whenError(st);
    const text = st.text.trim();
    if (err) { state.repromiseError = err; render(); return; }
    if (!text) { state.repromiseError = 'やることを入れてください。'; render(); return; }
    if (!old) return;
    const np = makePromise(old.recordId, old.tag, 'first', text, old.first, composeWhen(st) || '', old.id);
    const proms = loadProms().map((x) => (x.id === old.id ? Object.assign({}, x, { status: 'replaced' }) : x));
    proms.push(np);
    saveProms(proms);
    state.repromise = null; state.repromiseError = '';
    showPromises({
      filter: 'todo',
      msg: np.when ? `約束しました(${fmtWhen(np.when)})。` : '約束しました。日付は、約束のページであとから決められます。'
    });
  } else if (act === 'release') {
    if (window.confirm('この約束を手放します。記録には残りますが、保留から外れます。よろしいですか?')) {
      updateProm(btn.dataset.id, { status: 'released' });
      state.holdMsg = '手放しました。手放すのも、ひとつの選び方です。';
      render({ focusTop: true });
    }
  } else if (act === 'open-teacher') {
    goto('teacher');
  } else if (act === 'open-about') {
    goto('about');
  }
};
app.addEventListener('click', onClick);
document.getElementById('tabbar').addEventListener('click', onClick);

/* 数字だけの欄(年度・全問題数・正答数)。全角数字は半角にして、数字以外は取り除く */
const DIGIT_MAX = { year: 4, full: 3, score: 3 };
function cleanDigits(t) {
  const key = t.dataset.text;
  if (!(key in DIGIT_MAX)) return;
  const v = t.value.normalize('NFKC').replace(/\D/g, '').slice(0, DIGIT_MAX[key]);
  if (v !== t.value) t.value = v;
}
/* 「大学」だけが入っている欄は、最初にタップしたとき、カーソルを「大学」の前に置く */
app.addEventListener('focusin', (e) => {
  const t = e.target;
  if (t.matches && t.matches('[data-uf="name"]') && t.value === UNIV_SUFFIX) {
    setTimeout(() => { try { t.setSelectionRange(0, 0); } catch (err) { /* noop */ } }, 0);
  } else if (t.matches && t.matches('[data-text="sched"]')) {
    updateSchedSuggest();
  }
});

app.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-text]')) {
    cleanDigits(t);
    state.a[t.dataset.text] = t.value;
  } else if (t.matches('[data-bind]')) {
    state.a[t.dataset.bind] = t.value;
    state.error = '';
  } else if (t.matches('[data-miss]:not([data-text-miss])')) {
    const m = state.a.misses[Number(t.dataset.miss)];
    const key = t.dataset.key;
    m[key] = t.value;
    state.error = '';
    if (key === 'form') { m.reason = ''; render({ focusSelector: radioSel(t) }); }
  } else if (t.matches('[data-pr]') && t.type === 'radio') {
    const st = whenTarget(t.dataset.prt);
    const key = t.dataset.pr;
    st[key] = t.value;
    if (key === 'scope' && !st.edited) {
      st.base = promiseText(state.result.d.primary, t.value, state.a);
      st.text = st.base;
    } else if (key === 'scope') {
      st.base = promiseText(state.result.d.primary, t.value, state.a);
    }
    if (t.dataset.prt === 'repromise') state.repromiseError = ''; else state.promiseError = '';
    render({ focusSelector: radioSel(t) });
  } else if (t.matches('[data-fu]')) {
    state.followup[t.dataset.fu] = t.value;
    state.followupError = '';
    if (t.dataset.fu === 'status') { state.followup.reason = ''; render({ focusSelector: radioSel(t) }); }
  } else if (t.id === 'include-memo') {
    state.includeMemo = t.checked;
    const ta = document.getElementById('prompt-text');
    if (ta) ta.value = buildPrompt(state.a, state.result.d, state.includeMemo, state.result.prevProm);
  }
});

app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-text]')) {
    if (!e.isComposing) cleanDigits(t);
    state.a[t.dataset.text] = t.value;
    if (t.dataset.text === 'sched') updateSchedSuggest();
  } else if (t.matches('[data-text-miss]')) state.a.misses[Number(t.dataset.miss)][t.dataset.key] = t.value;
  else if (t.matches('[data-pr]') && t.type !== 'radio') {
    const st = whenTarget(t.dataset.prt);
    st[t.dataset.pr] = t.value;
    if (t.dataset.pr === 'text') st.edited = t.value !== st.base;
  }
  else if (t.matches('[data-uf]')) {
    state.univForm[t.dataset.uf] = t.value;
    /* 入力し直したら、赤い枠をはずす */
    if (state.univErrors[t.dataset.uf]) { state.univErrors[t.dataset.uf] = false; t.classList.remove('invalid'); t.removeAttribute('aria-invalid'); }
  }
  else if (t.matches('[data-te]')) state.targetEdit[t.dataset.te] = t.value;
});

state.step = isWelcomed() ? 'intro' : 'welcome';
try { history.replaceState({ step: state.step, univId: '' }, '', location.pathname + location.search); } catch (e) { /* noop */ }
render();
})();
</script>
</body>
