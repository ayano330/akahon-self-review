name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 公開するのは、アプリの表示に必要なファイルだけ(docs/・元画像・使わない先生の画像は公開URLに出さない)
      - name: Stage public files
        run: |
          mkdir -p _site/teachers
          cp index.html v2.html v3.html manifest.webmanifest _site/
          cp akahon-icon-32.png akahon-icon-180.png akahon-icon-512.png akahon-header-bg.jpg _site/
          # 先生の画像を足すときは、掲載許可を得てから、ここにも1行足す
          cp teachers/masuoka.png teachers/minami.png _site/teachers/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
